name: golangci-lint
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
permissions:
  contents: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      matrix: { dir: ['./...', './worker', './worker/edge', './runner'] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # go-version-file needs the checkout, so this has to stay after it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # The runner has node but not pnpm. corepack is no longer bundled with node as of
      # 25, so install it rather than rely on the runner image still carrying it;
      # installing corepack rather than pnpm keeps packageManager in each package.json
      # the single place the pnpm version is pinned. --force because corepack's yarn
      # shim collides with the one already on the runner.
      - name: Set up pnpm
        run: npm install -g corepack@latest --force && corepack enable pnpm
      - name: Install modules
        working-directory: ./web
        run: pnpm install --frozen-lockfile
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          only-new-issues: true

