name: golangci-lint
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
permissions:
  contents: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    strategy:
      matrix: { dir: ['./...', './worker', './edge-service', './runner'] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # go-version-file needs the checkout, so this has to stay after it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # The server embeds the built SPA and refuses to start without one, so the
      # linter needs the same build go-test does to type-check against it.
      - name: Set up pnpm
        run: npm install -g corepack@latest --force && corepack enable pnpm
      - name: Build SPA
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          only-new-issues: true

