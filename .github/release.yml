# Categories for GitHub's own "generate release notes" button. The tagged
# releases are written by .github/workflows/release.yml from the commit history
# instead; this only shapes notes generated by hand in the web UI.
changelog:
  categories:
    - title: 🚀 Features
      labels: ['enhancement', 'feature']
    - title: 🐛 Fixes
      labels: ['bug', 'fix']
    - title: 📦 Dependencies
      labels: ['dependencies']
    - title: 📚 Documentation
      labels: ['documentation']
    - title: 📝 Other Changes
      labels: ['*']
