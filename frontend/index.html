<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <!--
      Font Awesome, loaded the same way every server-rendered page loads it: from the
      vendor copy webpack.common.js copies out of web/node_modules (see vendorPatterns
      in web/webpack.common.js). Sharing the file keeps the icons identical across both
      frontends and costs no bundle weight.
    -->
    <link rel="stylesheet" href="/static/assets/vendor/fontawesome/css/all.min.css" />
    <title>TUM-Live</title>
    <script>
      // Applies the theme before first paint to avoid a flash of the wrong theme.
      // Mirrors web/assets/init.js and shares its localStorage key, so toggling the
      // theme on a migrated page carries over to the server-rendered ones.
      (function () {
        if (!("themeMode" in localStorage)) {
          localStorage.themeMode = "system";
        }
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var shouldBeDark =
          localStorage.themeMode === "dark" ||
          (localStorage.themeMode === "system" && prefersDark);
        document.documentElement.classList.toggle("dark", shouldBeDark);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
