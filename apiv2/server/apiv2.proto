///////////////////////////////
/////// COURSE_MESSAGE ////////
///////////////////////////////

message Course {
  uint32 id = 1;
  string name = 2;
  string slug = 3;
  Semester semester = 4;
  string tum_online_identifier = 5;
  bool vod_enabled = 6;
  bool downloads_enabled = 7;
  bool chat_enabled = 8;
  bool anonymous_chat_enabled = 9;
  bool moderated_chat_enabled = 10;
  bool vod_chat_enabled = 11;
  repeated Stream streams = 12;
  string camera_preset_preferences = 13;
  string source_preferences = 14;

  // Superseded by last_recording and next_lecture, which carry the whole stream. A
  // listing needs the start date and the duration, not only an id to fetch them with.
  reserved 15, 16;
  reserved "last_recording_id", "next_lecture_id";

  // The most recent recorded lecture, absent when the course has none.
  optional Stream last_recording = 17;
  // The next lecture that has not ended yet, absent when the course has none.
  optional Stream next_lecture = 18;

  // One of "public", "loggedin", "enrolled" or "hidden". Listings that reach the
  // caller are already filtered by it; it is here so the page can mark a hidden
  // course as such for the administrators who do see it.
  string visibility = 19;
  // Whether the calling user has pinned this course. False for anonymous callers.
  bool pinned = 20;
  // Whether the calling user administers this course, as opposed to being a global
  // admin. Drives the per-course admin link.
  bool is_admin = 21;
}

