///////////////////////////////
//// NOTIFICATION_MESSAGE /////
///////////////////////////////

message UserGroupNotification {
  string title = 1;
  string body = 2;
  NotificationTarget target = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ServerNotification {
  string text = 1;
  bool warn = 2;
  google.protobuf.Timestamp start = 3;
  google.protobuf.Timestamp expires = 4;
}

// The user group a notification is shown to. The numbers deliberately match
// model.NotificationTarget, which starts at 1, so the two cannot drift; proto3 needs
// a zero value, and an unset target is not "everyone" but a bug, so it gets its own.
enum NotificationTarget {
  TARGET_UNSPECIFIED = 0;
  TARGET_ALL = 1;
  TARGET_USER = 2;
  TARGET_STUDENT = 3;
  TARGET_LECTURER = 4;
  TARGET_ADMIN = 5;
}

///////////////////////////////
//// NOTIFICATION_RESPONSE ////
///////////////////////////////

message GetNotificationsResponse {
  repeated UserGroupNotification notifications = 1;
}

message GetServerNotificationsResponse {
  repeated ServerNotification server_notifications = 1;
}

///////////////////////////////////
//// SERVER_NOTIFICATION_ADMIN /////
///////////////////////////////////

// ServerNotificationAdmin is a server notification as an administrator manages it,
// carrying the id ServerNotification (the public read model above) omits.
message ServerNotificationAdmin {
  uint32 id = 1;
  string text = 2;
  bool warn = 3;
  google.protobuf.Timestamp start = 4;
  google.protobuf.Timestamp expires = 5;
}

message ListServerNotificationsAdminResponse {
  repeated ServerNotificationAdmin notifications = 1;
}

message CreateServerNotificationRequest {
  string text = 1;
  bool warn = 2;
  google.protobuf.Timestamp start = 3;
  google.protobuf.Timestamp expires = 4;
}

message UpdateServerNotificationRequest {
  uint32 id = 1;
  string text = 2;
  bool warn = 3;
  google.protobuf.Timestamp start = 4;
  google.protobuf.Timestamp expires = 5;
}

message DeleteServerNotificationRequest {
  uint32 id = 1;
}

///////////////////////////////
//// NOTIFICATION_ADMIN_MESSAGE
///////////////////////////////

// AdminNotification is a broadcast notification as an administrator manages it.
// Distinct from UserGroupNotification above, which is what a recipient is shown:
// this carries an id, so a specific entry can be deleted. Named with the Admin
// prefix because a bare "Notification" already exists in runner/notifications.proto,
// registered under the same "protobuf" package -- reusing the name panics the
// process at startup with a proto registry name conflict.
message AdminNotification {
  uint32 id = 1;
  // Empty when the notification has no title.
  string title = 2;
  string body = 3;
  // Reuses NotificationTarget's values, but model.NotificationTarget numbers its
  // targets from 1, not 0, so this is a plain uint32 rather than the enum -- casting
  // model.NotificationTarget straight into NotificationTarget would shift every value
  // down by one (see apiv2/helpers/parser.go's ParseNotificationToProto, which already
  // does this for the read side; nothing there reads the shifted field back out, so it
  // has gone unnoticed).
  uint32 target = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ListNotificationsAdminResponse {
  repeated AdminNotification notifications = 1;
}

message CreateNotificationRequest {
  string title = 1;
  string body = 2;
  uint32 target = 3;
}

message DeleteNotificationRequest {
  uint32 id = 1;
}

///////////////////////////////
/////// LECTURE_HALL_MESSAGE ///
///////////////////////////////

message LectureHall {
  uint32 id = 1;
  string name = 2;
  repeated CameraPreset camera_presets = 3;
  // Where the room is, on whatever campus map the deployment points at. The live
  // lecture badge links to it.
  string external_url = 4;
}

message CameraPreset {
  uint32 id = 1;
  string name = 2;
  string description = 3;
}

///////////////////////////////
//////// RUNNER_MESSAGE ///////
///////////////////////////////

message Runner {
  // Runners are keyed by hostname; there is no numeric id.
  string hostname = 1;
  uint32 port = 2;
  string version = 3;
  // Derived from last_seen: dead after five seconds without a heartbeat. Sent
  // computed so a client cannot disagree with the scheduler.
  bool alive = 4;
  // Jobs currently running, as of the last heartbeat.
  uint64 job_count = 5;
  // draining means the runner is shutting down and is being given no further jobs.
  bool draining = 6;
  google.protobuf.Timestamp last_seen = 7;
  google.protobuf.Timestamp time_of_register = 8;
}

///////////////////////////////
//////// RUNNER_REQUEST ///////
///////////////////////////////

message DeleteRunnerRequest {
  string hostname = 1;
}

///////////////////////////////
/////// RUNNER_RESPONSE ///////
///////////////////////////////

message ListRunnersResponse {
  repeated Runner runners = 1;
}

///////////////////////////////
//////// WORKER_MESSAGE ///////
///////////////////////////////

// Worker is the older, pre-runner equivalent: it also transcodes, but is keyed by a
// self-generated UUID rather than hostname and carries VM stats the runner does not.
message Worker {
  string worker_id = 1;
  string host = 2;
  string version = 3;
  // Derived from last_seen: dead after six minutes without a heartbeat. Sent
  // computed so a client cannot disagree with the scheduler.
  bool alive = 4;
  // How much the worker has to do: +1 per silence detection job, +2 per converting
  // job, +3 per streaming job.
  uint32 workload = 5;
  // The jobs currently running, as a comma-separated summary the worker sends itself.
  string status = 6;
  // VM stats, self-reported by the worker; empty until it has sent a heartbeat.
  string cpu = 7;
  string memory = 8;
  string disk = 9;
  string uptime = 10;
  google.protobuf.Timestamp last_seen = 11;
}

///////////////////////////////
//////// WORKER_REQUEST ///////
///////////////////////////////

message DeleteWorkerRequest {
  string worker_id = 1;
}

///////////////////////////////
/////// WORKER_RESPONSE ///////
///////////////////////////////

message ListWorkersResponse {
  repeated Worker workers = 1;
  // The token a new worker authenticates its gRPC registration with. Configuration,
  // not a per-caller secret -- server.administer already gates the whole page.
  string worker_token = 2;
}

