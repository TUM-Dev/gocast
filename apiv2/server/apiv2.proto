}

// ----- Course administration -----

message GetCourseAdminRequest {
  uint32 course_id = 1;
}

// A course as its administrators see and edit it.
message CourseAdmin {
  uint32 id = 1;
  string name = 2;
  string slug = 3;
  int32 year = 4;
  // "W" or "S".
  string term = 5;
  // "public", "loggedin", "enrolled" or "hidden".
  string visibility = 6;
  bool vod_enabled = 7;
  bool downloads_enabled = 8;
  bool chat_enabled = 9;
  bool anonymous_chat_enabled = 10;
  bool moderated_chat_enabled = 11;
  // Read-only: nothing has ever set it, so no page offers it.
  bool vod_chat_enabled = 12;
  bool live_private = 13;
  bool vod_private = 14;
  // "de", "en" or empty.
  string language = 15;
  string tum_online_identifier = 16;
  // The course's owner; administrators are listed by listCourseAdmins.
  uint32 user_id = 17;
}

// The settings v1's course settings form edited.
message UpdateCourseSettingsRequest {
  uint32 course_id = 1;
  // "public", "loggedin", "enrolled" or "hidden".
  optional string visibility = 2;
  optional bool vod_enabled = 3;
  optional bool downloads_enabled = 4;
  optional bool chat_enabled = 5;
  optional bool anonymous_chat_enabled = 6;
  optional bool moderated_chat_enabled = 7;
  optional bool live_private = 8;
  optional bool vod_private = 9;
}

message CopyCourseRequest {
  uint32 course_id = 1;
  // The semester to copy into.
  int32 year = 2;
  // "W" or "S".
  string term = 3;
}

message CopyCourseResponse {
  uint32 course_id = 1;
  // Lectures and administrators that could not be copied; the course itself was.
  int32 num_errors = 2;
}

message DeleteCourseRequest {
  uint32 course_id = 1;
}

message RedoCoursePostProcessingRequest {
  uint32 course_id = 1;
}

// An account as the course page shows it to the course's administrators.
message CourseAdminUser {
  uint32 id = 1;
  string name = 2;
  // The email address, or the TUM login without one.
  string login = 3;
  uint32 role = 4;
}

message ListCourseAdminsRequest {
  uint32 course_id = 1;
}

message ListCourseAdminsResponse {
  repeated CourseAdminUser admins = 1;
}

message AddCourseAdminRequest {
  uint32 course_id = 1;
  uint32 user_id = 2;
}

message RemoveCourseAdminRequest {
  uint32 course_id = 1;
  uint32 user_id = 2;
}

message SearchUsersForCourseRequest {
  uint32 course_id = 1;
  string q = 2;
}

message SearchUsersForCourseResponse {
  repeated CourseAdminUser users = 1;
}

// Which sources a course's lectures in a hall stream; model.SourceMode.
enum CourseSourceMode {
  COURSE_SOURCE_MODE_COMBINED = 0;
  COURSE_SOURCE_MODE_PRESENTATION_ONLY = 1;
  COURSE_SOURCE_MODE_CAMERA_ONLY = 2;
}

message CourseLectureHallPreset {
  // The preset's number on the hall's camera.
  int32 preset_id = 1;
  string name = 2;
  string image = 3;
  bool is_default = 4;
}

// A course's settings for one lecture hall it has lectures in.
message CourseLectureHallSetting {
  uint32 lecture_hall_id = 1;
  string lecture_hall_name = 2;
  repeated CourseLectureHallPreset presets = 3;
  CourseSourceMode source_mode = 4;
  // 0 when the course chose none, and the hall's default preset applies.
  int32 selected_preset_id = 5;
}

message ListCourseLectureHallSettingsRequest {
  uint32 course_id = 1;
}

message ListCourseLectureHallSettingsResponse {
  repeated CourseLectureHallSetting lecture_halls = 1;
}

message CourseLectureHallSettingUpdate {
  uint32 lecture_hall_id = 1;
  CourseSourceMode source_mode = 2;
  // One of the hall's presets, or 0 for its default.
  int32 selected_preset_id = 3;
}

message UpdateCourseLectureHallSettingsRequest {
  uint32 course_id = 1;
  repeated CourseLectureHallSettingUpdate lecture_halls = 2;
}

message CourseParticipant {
  uint32 id = 1;
  string name = 2;
  string email = 3;
  // Whether they have set a password yet.
  bool account_set_up = 4;
}

message ListCourseParticipantsRequest {
  uint32 course_id = 1;
}

message ListCourseParticipantsResponse {
  repeated CourseParticipant participants = 1;
}

message CourseInvitee {
