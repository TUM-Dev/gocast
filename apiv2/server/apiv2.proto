/////// STREAM_MESSAGE ////////
///////////////////////////////

message Stream {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  uint32 course_id = 4;
  google.protobuf.Timestamp start = 5;
  google.protobuf.Timestamp end = 6;
  bool chat_enabled = 7;
  string room_name = 8;
  string room_code = 9;
  string event_type_name = 10;
  uint32 tum_online_event_id = 11;
  string series_identifier = 12;
  string playlist_url = 13;
  string playlist_url_pres = 14;
  string playlist_url_cam = 15;
  bool liveNow = 16;
  google.protobuf.Timestamp live_now_timestamp = 17;
  bool recording = 18;
  bool premiere = 19;
  bool ended = 20;
  uint32 vod_views = 21;
  uint32 start_offset = 22;
  uint32 end_offset = 23;
  uint32 duration = 28;
  repeated Download downloads = 29;
  bool is_planned = 30;
  bool is_coming_up = 31;
  string hls_url = 32;
  // False for a private lecture. Only a course administrator is ever sent one, so
  // this marks the lectures that the rest of the course cannot see.
  bool is_publicly_visible = 33;
}

message StreamPlaylistEntry {
  uint32 stream_id = 1;
  string course_slug = 2;
  string stream_name = 3;
  bool live_now = 4;
  bool watched = 5;
  google.protobuf.Timestamp start = 6;
  StreamProgress stream_progress = 7;
  google.protobuf.Timestamp created_at = 8;
}

message StreamProgress {
  uint32 stream_id = 1;
  float progress = 2;
  bool watched = 3;
}

message VideoSection {
  string description = 1;
  uint32 start_hours = 2;
  uint32 start_minutes = 3;
  uint32 start_seconds = 4;
  uint32 stream_id = 5;
  uint32 file_id = 6;
}

enum VideoType {
  COMB = 0;
  PRES = 1;
  CAM = 2;
}

