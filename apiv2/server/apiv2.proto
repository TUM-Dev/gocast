      description: "Deletes a notification; it stops showing to users immediately. Requires the server.administer permission."
    };
  }

  rpc listAudits(ListAuditsRequest) returns (ListAuditsResponse) {
    option (google.api.http) = {get: "/admin/audits"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Audits"
      summary: "List server audit log entries."
      description: "Retrieves one page of the server-wide audit log -- course and stream changes, camera moves, and warnings or errors the backend surfaced itself -- newest first. Requires the server.administer permission."
    };
  }

  rpc getServerStats(google.protobuf.Empty) returns (ServerStatsResponse) {
    option (google.api.http) = {get: "/admin/server-stats"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Server Statistics"
      summary: "Get server-wide usage statistics."
      description: "Retrieves the quick counters and the charted activity for the whole deployment, i.e. the same data api/statistics.go serves a course for, with courseID 0. Requires the server.administer permission."
    };
  }

  rpc exportServerStats(ExportServerStatsRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/admin/server-stats/export"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Server Statistics"
      summary: "Export server-wide usage statistics."
      description: "Bundles the same data getServerStats renders as a single downloadable file, as JSON or CSV. Requires the server.administer permission."
    };
  }

  // The methods below manage the lecture halls known to the scheduler and the
  // recording pipeline. Named "*Admin" and "LectureHallAdmin" rather than plain
  // "LectureHall" because that name, and CameraPreset, are already taken by the
  // viewer-facing messages further down (see LECTURE_HALL_MESSAGE) with a different
  // shape; the admin preset type is CameraPresetAdmin for the same reason.
  rpc listLectureHallsAdmin(google.protobuf.Empty) returns (ListLectureHallsAdminResponse) {
    option (google.api.http) = {get: "/admin/lecture-halls"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Lecture Halls"
      summary: "List every lecture hall for administration."
      description: "Retrieves every lecture hall with its stream sources. Requires the server.administer permission."
    };
  }

  rpc createLectureHallAdmin(CreateLectureHallAdminRequest) returns (LectureHallAdmin) {
    option (google.api.http) = {
      post: "/admin/lecture-halls"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Lecture Halls"
      summary: "Create a lecture hall."
      description: "Creates a lecture hall the scheduler can assign lectures to. Requires the server.administer permission."
    };
  }

  rpc updateLectureHallAdmin(UpdateLectureHallAdminRequest) returns (LectureHallAdmin) {
    option (google.api.http) = {
      patch: "/admin/lecture-halls/{id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Lecture Halls"
      summary: "Update a lecture hall."
      description: "Replaces a lecture hall's name, stream protocol and stream sources. Requires the server.administer permission."
    };
  }

  rpc deleteLectureHallAdmin(DeleteLectureHallAdminRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/lecture-halls/{id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Lecture Halls"
      summary: "Delete a lecture hall."
      description: "Deletes a lecture hall; its streams keep playing but lose the hall association. Requires the server.administer permission."
    };
  }

  // The three methods below manage a hall's camera presets. All three reach the
  // physical camera, so they answer Unknown/InvalidArgument/Unavailable the way
  // (*API).cameraFor documents, on top of the usual permission failures.
  rpc refreshLectureHallPresetsAdmin(RefreshLectureHallPresetsAdminRequest) returns (LectureHallAdmin) {
    option (google.api.http) = {post: "/admin/lecture-halls/{id}/presets/refresh"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Lecture Halls"
      summary: "Refresh a lecture hall's camera presets."
      description: "Fetches the presets configured on the hall's camera and replaces the stored list with them. Requires the server.administer permission."
    };
  }

  rpc setDefaultCameraPresetAdmin(SetDefaultCameraPresetAdminRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/lecture-halls/{lecture_hall_id}/presets/{preset_id}/default"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Lecture Halls"
      summary: "Mark a camera preset the hall's default."
      description: "Marks one preset default for the hall and unsets the others. The default is what a stream's recording starts pointed at. Requires the server.administer permission."
    };
  }

  rpc takeCameraPresetSnapshotAdmin(TakeCameraPresetSnapshotAdminRequest) returns (CameraPresetAdmin) {
    option (google.api.http) = {
      post: "/admin/lecture-halls/{lecture_hall_id}/presets/{preset_id}/snapshot"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Lecture Halls"
      summary: "Take a new preview snapshot of a camera preset."
      description: "Moves the camera to the preset, waits for it to arrive, and photographs it. Requires the server.administer permission."
    };
  }
}

///////////////////////////////
///// HEALTHCHECK_MESSAGE /////
///////////////////////////////

message HealthCheckResponse {
  string status = 1;
}

// Branding is the deployment's own name for itself, configured in branding.yaml.
message Branding {
  string title = 1;
  string description = 2;
}

message GetFrontendConfigResponse {
  Branding branding = 1;
  // versionTag is the build's version, or "development" for an unversioned build.
  string version_tag = 2;
  // wikiUrl and canonicalUrl are empty when the deployment has not configured them.
  string wiki_url = 3;
  string canonical_url = 4;
  // isFreshInstallation reports that the database holds no users yet, so the
  // frontend can offer to create the first account instead of a login form.
  bool is_fresh_installation = 5;
}

// The name is the page's route -- its slug, e.g. "privacy" -- not the editable title
// stored beside its content.
message GetInfoPageRequest {
  string name = 1;
}

message GetInfoPageResponse {
  // name echoes the requested route name.
  string name = 1;
  // Rendered from Markdown and sanitised server-side; the client must not do it again.
  string content = 2;
}

message ListInfoPagesResponse {
  repeated InfoPageSummary pages = 1;
}

// InfoPageSummary is what a visitor is told exists, before asking for one by slug.
message InfoPageSummary {
  string slug = 1;
  string name = 2;
}

///////////////////////////////
///// INFO_PAGE_ADMIN_MESSAGE //
///////////////////////////////

// InfoPage is a page as an administrator edits it, with its raw, unrendered content.
message InfoPage {
  uint32 id = 1;
  // The page's route and API key. Unique; a client should treat changing it as
  // renaming the page's URL, not merely relabeling it.
  string slug = 2;
  // The editable display title, shown to administrators managing the page. Not
  // rendered on the page itself, which opens with its own Markdown heading.
  string name = 3;
  string raw_content = 4;
}

message ListInfoPagesAdminResponse {
  repeated InfoPage pages = 1;
}

message CreateInfoPageRequest {
  string slug = 1;
  string name = 2;
  string raw_content = 3;
}

message UpdateInfoPageRequest {
  uint32 id = 1;
  string slug = 2;
  string name = 3;
  string raw_content = 4;
}

message DeleteInfoPageRequest {
  uint32 id = 1;
}

///////////////////////////////
//////// USER_MESSAGE /////////
///////////////////////////////

message User {
  uint32 id = 1;
  string name = 2;
  string last_name = 3;
  string email = 4;
  string matriculation_number = 5;
  string lrz_id = 6;
  uint32 role = 7;
  repeated Course courses = 8;
  repeated Course administered_courses = 9;
  repeated Course pinned_courses = 10;
  repeated UserSetting settings = 11;
  repeated Bookmark bookmarks = 12;
  google.protobuf.Timestamp created_at = 13;
  // What this user may do, as model/permissions.go spells it, so a client need not
  // know which role holds what. Not a substitute for the server's own checks.
  repeated string permissions = 14;
}

message UserSetting {
  UserSettingType type = 3;
  string value = 4;
}

// UserSettingType identifies a single user preference.
//
// The values are model.UserSettingType - 1 (see apiv2/helpers/parser.go), so this
// enum has to stay aligned with the constants in model/user.go. Values were
// previously unnamed beyond CUSTOM_PLAYBACK_SPEEDS and travelled as bare numbers.
enum UserSettingType {
  PREFERRED_NAME = 0;
  GREETING = 1;
  // The per-speed enabled flags, stored as a JSON array.
  CUSTOM_PLAYBACK_SPEEDS = 2;
  SEEKING_TIME = 3;
  // Speeds the user added themselves, stored as a JSON array.
  USER_DEFINED_SPEEDS = 4;
  AUTO_SKIP = 5;
  // Mirrors model.defaultMode, which is no longer used. Present only to keep the
  // numbering aligned with model.UserSettingType.
  DEFAULT_MODE = 6 [deprecated = true];
  LECTURE_VIEW = 7;
}

///////////////////////////////
//////// USER_REQUEST /////////
///////////////////////////////

message UpdateUserSettingsRequest {
  repeated UserSetting user_settings = 1;
}

message ResetPasswordRequest {
  string email = 1;
}

///////////////////////////////
//////// USER_RESPONSE ////////
///////////////////////////////

message GetUserResponse {
  User user = 1;
}

message UpdateUserSettingsResponse {
  repeated UserSetting user_settings = 1;
}

message ResetPasswordResponse {
  string message = 1;
}

message GetLoginOptionsResponse {
  // Whether an identity provider is configured. When false, only the username and
  // password form applies.
  bool use_saml = 1;
  // Display name of the identity provider, shown on its sign-in button.
  string idp_name = 2;
  // Brand colour for that button, as a CSS colour. May be empty.
  string idp_color = 3;
}

message ExportPersonalDataResponse {
  User user_data = 1;
  repeated Enrollment enrollments = 2;
  repeated VideoView video_views = 3;
  repeated Chat chats = 4;
}

message Enrollment {
  int32 year = 1;
  string term = 2;
  string course = 3;
}

message VideoView {
  uint32 stream_id = 1;
  float progress = 2;
  bool marked_finished = 3;
}

message Chat {
  uint32 stream_id = 1;
  string message = 2;
  google.protobuf.Timestamp created_at = 3;
}

