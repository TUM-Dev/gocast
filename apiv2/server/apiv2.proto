///////////////////////////////
///// HEALTHCHECK_MESSAGE /////
///////////////////////////////

message HealthCheckResponse {
  string status = 1;
}

// Branding is the deployment's own name for itself, configured in branding.yaml.
message Branding {
  string title = 1;
  string description = 2;
}

message GetFrontendConfigResponse {
  Branding branding = 1;
  // versionTag is the build's version, or "development" for an unversioned build.
  string version_tag = 2;
  // wikiUrl and canonicalUrl are empty when the deployment has not configured them.
  string wiki_url = 3;
  string canonical_url = 4;
  // isFreshInstallation reports that the database holds no users yet, so the
  // frontend can offer to create the first account instead of a login form.
  bool is_fresh_installation = 5;
  // ingestBase is the RTMP address a self-streaming lecturer's client connects to; a
  // lecture's stream is `<ingest_base><course slug>-<lecture id>?secret=<stream key>`.
  // Not a secret: the key is what authorises a stream. Empty when not configured.
  string ingest_base = 6;
}

// The name is the page's route -- its slug, e.g. "privacy" -- not the editable title
// stored beside its content.
message GetInfoPageRequest {
  string name = 1;
}

message GetInfoPageResponse {
  // name echoes the requested route name.
  string name = 1;
  // Rendered from Markdown and sanitised server-side; the client must not do it again.
  string content = 2;
}

message ListInfoPagesResponse {
  repeated InfoPageSummary pages = 1;
}

// InfoPageSummary is what a visitor is told exists, before asking for one by slug.
message InfoPageSummary {
  string slug = 1;
  string name = 2;
}

///////////////////////////////
///// INFO_PAGE_ADMIN_MESSAGE //
///////////////////////////////

// InfoPage is a page as an administrator edits it, with its raw, unrendered content.
message InfoPage {
  uint32 id = 1;
  // The page's route and API key. Unique; a client should treat changing it as
  // renaming the page's URL, not merely relabeling it.
  string slug = 2;
  // The editable display title, shown to administrators managing the page. Not
  // rendered on the page itself, which opens with its own Markdown heading.
  string name = 3;
  string raw_content = 4;
}

message ListInfoPagesAdminResponse {
  repeated InfoPage pages = 1;
}

message CreateInfoPageRequest {
  string slug = 1;
  string name = 2;
  string raw_content = 3;
}

message UpdateInfoPageRequest {
  uint32 id = 1;
  string slug = 2;
  string name = 3;
  string raw_content = 4;
}

message DeleteInfoPageRequest {
  uint32 id = 1;
}

///////////////////////////////
//////// USER_MESSAGE /////////
///////////////////////////////

message User {
  uint32 id = 1;
  string name = 2;
  string last_name = 3;
  string email = 4;
  string matriculation_number = 5;
  string lrz_id = 6;
  uint32 role = 7;
  repeated Course courses = 8;
  repeated Course administered_courses = 9;
  repeated Course pinned_courses = 10;
  repeated UserSetting settings = 11;
  repeated Bookmark bookmarks = 12;
  google.protobuf.Timestamp created_at = 13;
  // What this user may do, as model/permissions.go spells it, so a client need not
  // know which role holds what. Not a substitute for the server's own checks.
  repeated string permissions = 14;
}

message UserSetting {
  UserSettingType type = 3;
  string value = 4;
}

// UserSettingType identifies a single user preference.
//
// The values are model.UserSettingType - 1 (see apiv2/helpers/parser.go), so this
// enum has to stay aligned with the constants in model/user.go. Values were
// previously unnamed beyond CUSTOM_PLAYBACK_SPEEDS and travelled as bare numbers.
enum UserSettingType {
  PREFERRED_NAME = 0;
  GREETING = 1;
  // The per-speed enabled flags, stored as a JSON array.
  CUSTOM_PLAYBACK_SPEEDS = 2;
  SEEKING_TIME = 3;
  // Speeds the user added themselves, stored as a JSON array.
  USER_DEFINED_SPEEDS = 4;
  AUTO_SKIP = 5;
  // Mirrors model.defaultMode, which is no longer used. Present only to keep the
  // numbering aligned with model.UserSettingType.
  DEFAULT_MODE = 6 [deprecated = true];
  LECTURE_VIEW = 7;
}

///////////////////////////////
//////// USER_REQUEST /////////
///////////////////////////////

message UpdateUserSettingsRequest {
  repeated UserSetting user_settings = 1;
}

message ResetPasswordRequest {
  string email = 1;
}

///////////////////////////////
//////// USER_RESPONSE ////////
///////////////////////////////

message GetUserResponse {
  User user = 1;
}

message UpdateUserSettingsResponse {
  repeated UserSetting user_settings = 1;
}

message ResetPasswordResponse {
  string message = 1;
}

message GetLoginOptionsResponse {
  // Whether an identity provider is configured. When false, only the username and
  // password form applies.
  bool use_saml = 1;
  // Display name of the identity provider, shown on its sign-in button.
  string idp_name = 2;
  // Brand colour for that button, as a CSS colour. May be empty.
  string idp_color = 3;
}

message ExportPersonalDataResponse {
  User user_data = 1;
  repeated Enrollment enrollments = 2;
  repeated VideoView video_views = 3;
  repeated Chat chats = 4;
}

message Enrollment {
  int32 year = 1;
  string term = 2;
  string course = 3;
}

message VideoView {
  uint32 stream_id = 1;
  float progress = 2;
  bool marked_finished = 3;
}

message Chat {
  uint32 stream_id = 1;
  string message = 2;
  google.protobuf.Timestamp created_at = 3;
}

///////////////////////////////
////// BOOKMARK_MESSAGE ///////
///////////////////////////////

message Bookmark {
  uint32 bookmark_id = 1;
  string description = 2;
  uint32 hours = 3;
  uint32 minutes = 4;
  uint32 seconds = 5;
  uint32 user_id = 6;
  uint32 stream_id = 7;
}

///////////////////////////////
////// BOOKMARK_REQUEST ///////
///////////////////////////////

message GetBookmarksRequest {
  uint32 stream_id = 1;
}

message AddBookmarkRequest {
  uint32 stream_id = 1;
  string description = 2;
  uint32 hours = 3;
  uint32 minutes = 4;
  uint32 seconds = 5;
}

message UpdateBookmarkRequest {
  uint32 bookmark_id = 1;
  string description = 2;
  uint32 hours = 3;
  uint32 minutes = 4;
  uint32 seconds = 5;
}

message DeleteBookmarkRequest {
  uint32 bookmark_id = 1;
}

///////////////////////////////
////// BOOKMARK_RESPONSE //////
///////////////////////////////

