  string email = 2;
}

message InviteCourseParticipantsRequest {
  uint32 course_id = 1;
  repeated CourseInvitee invitees = 2;
}

message CourseInvitationResult {
  string email = 1;
  // False when the address already had an account, which was enrolled instead.
  bool account_created = 2;
  // Empty on success.
  string error = 3;
}

message InviteCourseParticipantsResponse {
  repeated CourseInvitationResult results = 1;
}

// A course in the administration sidebar.
message CourseAdminSummary {
  uint32 id = 1;
  string name = 2;
  string slug = 3;
  int32 year = 4;
  string term = 5;
}

message ListAdministeredCoursesResponse {
  repeated CourseAdminSummary courses = 1;
}

message GetLectureStatsRequest {
  uint32 course_id = 1;
  // Must be one of the course's lectures; anything else answers as missing.
  uint32 stream_id = 2;
}

message LectureStatsResponse {
  string course_name = 1;
  string lecture_name = 2;
  google.protobuf.Timestamp start = 3;
  google.protobuf.Timestamp end = 4;
  // Enrolled in the course; a lecture has no enrolment of its own.
  int64 num_students = 5;
  int32 vod_views = 6;
  // The most viewers the lecture had at once while it was live.
  int32 max_live_views = 7;
  // Concurrent viewers through the live lecture, by time of day.
  ServerStatsSeries live_viewers = 8;
  // VoD views by day of week.
  ServerStatsSeries weekdays = 9;
  // VoD views by calendar day.
  ServerStatsSeries all_days = 10;
  // Set for lectures from 2021 or earlier, which can predate the viewing data
  // (collected from 28 June 2021), so their numbers undercount.
  bool partial_history = 11;
}

// ----- Lecture administration -----

message ListCourseLecturesAdminRequest {
  uint32 course_id = 1;
}

message ListCourseLecturesAdminResponse {
  // Newest first.
  repeated CourseLectureAdmin lectures = 1;
}

// CourseLectureAdmin is a lecture as its course's administrators manage it. Unlike
// Stream, it carries the stream key and no signed playlist URLs.
message CourseLectureAdmin {
  uint32 id = 1;
  uint32 course_id = 2;
  string name = 3;
  string description = 4;
  google.protobuf.Timestamp start = 5;
  google.protobuf.Timestamp end = 6;
  // 0 and empty for a lecture in no hall (self-streamed).
  uint32 lecture_hall_id = 7;
  string lecture_hall_name = 8;
  // Shared by the lectures created together as a series; empty for a lone lecture.
  string series_identifier = 9;
  // The secret a self-streaming lecturer puts in the ingest URL.
  string stream_key = 10;
  bool chat_enabled = 11;
  bool private = 12;
  bool custom_thumbnail_enabled = 13;
  bool live_now = 14;
  // Has a recording (a VoD).
  bool recording = 15;
  // Ended and not yet recorded.
  bool past = 16;
  // A version is still transcoding.
  bool converting = 17;
  reserved 18;
  reserved "premiere";
  // The recorded versions there are: any of COMB, PRES and CAM.
  repeated string vod_versions = 19;
  // The recording's length in seconds, 0 when not known.
  uint32 duration_seconds = 20;
  repeated LectureFileAdmin files = 21;
  repeated LectureTranscodingProgress transcoding_progresses = 22;
  repeated LectureVideoSectionAdmin video_sections = 23;
}

message LectureFileAdmin {
  uint32 id = 1;
  // model.FileType: 2 = attachment, the thumbnail kinds above that.
  uint32 type = 2;
  string friendly_name = 3;
}

message LectureTranscodingProgress {
  // COMB, PRES or CAM.
  string version = 1;
  // Percent. Meaningless when failed.
  int32 progress = 2;
  // The conversion ended without a video. The version stays listed, with the reason,
  // until the next upload of it replaces it.
  bool failed = 3;
  // Why, in words for the person who uploaded the video. Only set when failed.
  string error = 4;
}

message LectureVideoSectionAdmin {
  uint32 id = 1;
  string description = 2;
  uint32 start_hours = 3;
  uint32 start_minutes = 4;
  uint32 start_seconds = 5;
  uint32 file_id = 6;
}

message UpdateLectureSeriesRequest {
  uint32 course_id = 1;
  // Any lecture of the series; must be one of the course's.
  uint32 stream_id = 2;
  optional string name = 3;
  optional string description = 4;
  // 0 moves the series out of any hall. Server administrators only.
  optional uint32 lecture_hall_id = 5;
  optional bool chat_enabled = 6;
}

message UpdateLectureSeriesTimeRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  // The lecture's own new times; the rest of the series takes their time of day
  // and duration. End must be after start.
  google.protobuf.Timestamp start = 3;
  google.protobuf.Timestamp end = 4;
}

message UpdateLecturesLectureHallRequest {
  uint32 course_id = 1;
  repeated uint32 stream_ids = 2;
  // 0 moves the lectures out of any hall (self-streamed).
  uint32 lecture_hall_id = 3;
}

message DeleteLecturesRequest {
  uint32 course_id = 1;
  repeated uint32 stream_ids = 2;
}

message DeleteLectureSeriesRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
}

message CopyLectureRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  // Must also be administered by the caller.
  uint32 target_course_id = 3;
  // Deletes the original once the copy exists.
  bool move = 4;
}

message CopyLectureResponse {
  // The copy's ID, a new one even on a move.
  uint32 stream_id = 1;
}

// What a created lecture is. LIVESTREAM, the zero value, is v1's default.
enum LectureCreationKind {
  // Streamed live: from its lecture hall, or by the lecturer with its stream key.
  LECTURE_CREATION_KIND_LIVESTREAM = 0;
  // A recording uploaded afterwards through POST .../streams/{stream_id}/media.
  LECTURE_CREATION_KIND_VOD_UPLOAD = 1;
  // 2 was PREMIERE, a recording streamed as if live. It needed a worker.
  reserved 2;
  reserved "LECTURE_CREATION_KIND_PREMIERE";
}

message CreateLecturesRequest {
  uint32 course_id = 1;
  // Required; every lecture created gets it.
  string title = 2;
  LectureCreationKind kind = 3;
  // The first lecture's start. Required unless ad_hoc.
  google.protobuf.Timestamp start = 4;
  // How long each lecture runs. Required for a livestream; a
  // VOD_UPLOAD given 0 gets an hour.
  uint32 duration_minutes = 5;
  // 0 for none: a self-streamed livestream, and always for the other kinds.
  uint32 lecture_hall_id = 6;
  bool chat_enabled = 7;
  // A livestream starting now (two minutes from now, for a worker to pick it up).
  bool ad_hoc = 8;
  // Further lectures besides the one at start, as v1's dateSeries: the client
  // computes the weekly or daily dates. Empty for a single lecture.
  repeated google.protobuf.Timestamp date_series = 9;
}

message CreateLecturesResponse {
  // The one at start first, then one per date_series entry in the order given.
  repeated CourseLectureAdmin lectures = 1;
}

// ----- Lecture administration, part 2 -----

message LectureSectionInput {
  string description = 1;
  uint32 start_hours = 2;
  // Below 60.
  uint32 start_minutes = 3;
  // Below 60.
  uint32 start_seconds = 4;
}

message CreateLectureSectionsRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  // At least one.
  repeated LectureSectionInput sections = 3;
}

message CreateLectureSectionsResponse {
  // All of the lecture's sections, the new ones included, in order of their start.
  repeated LectureVideoSectionAdmin sections = 1;
}

message UpdateLectureSectionRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  uint32 section_id = 3;
  string description = 4;
  uint32 start_hours = 5;
  uint32 start_minutes = 6;
  uint32 start_seconds = 7;
}

message DeleteLectureSectionRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  uint32 section_id = 3;
}

message DeleteLectureAttachmentRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  uint32 file_id = 3;
}

message DeleteLectureThumbnailRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
}

message RequestLectureSubtitlesRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  // The spoken language, as an ISO 639 code: "de" or "en" on the old page.
  string language = 3;
}

message GetLectureTranscodingProgressRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
}

message GetLectureTranscodingProgressResponse {
  // Versions still converting, and those whose conversion failed. Holds nothing
  // converting once every version has finished.
  repeated LectureTranscodingProgress progresses = 1;
}

// ----- end of lecture administration -----

///////////////////////////////
///// LECTURE_HALL_ADMIN //////
///////////////////////////////

// LectureHallAdmin is a lecture hall as an administrator configures it: the stream
// sources the worker/runner pulls from plus the optional hardware addresses. Distinct
// from LectureHall (LECTURE_HALL_MESSAGE above), which is the trimmed shape shown to
// viewers.
message LectureHallAdmin {
  uint32 id = 1;
  // As the hall is named in SMP, e.g. room_00_13_009A -- not a free-form label.
  string name = 2;
  // 1 = rtsp, 2 = srt; mirrors model.StreamProtocol.
  uint32 stream_protocol = 3;
  string comb_ip = 4;
  string pres_ip = 5;
  string cam_ip = 6;
  // IP of the physical Axis camera itself (not the SMP address above). Empty for
  // halls with no camera, e.g. VMP backed ones.
  string camera_ip = 7;
  // Drives the red live light through an Anel PWR-Ctrl. Empty when there is none.
  string pwr_ctrl_ip = 8;
  // Empty until refreshLectureHallPresetsAdmin has fetched them at least once. Only
  // ever populated for a hall with camera_ip set.
  repeated CameraPresetAdmin camera_presets = 9;
}

// CameraPresetAdmin is a camera preset as an administrator manages it: named
// "*Admin" for the same reason as LectureHallAdmin -- CameraPreset above is the
// trimmed, viewer-facing shape.
message CameraPresetAdmin {
  uint32 lecture_hall_id = 1;
  // The camera's own numbering, not a database id -- this is what SetPreset on the
  // camera takes.
  uint32 preset_id = 2;
  string name = 3;
  // Filename under the static directory, empty until a snapshot has been taken.
  // Rendered as /public/{image}.
  string image = 4;
  bool is_default = 5;
}

message ListLectureHallsAdminResponse {
  repeated LectureHallAdmin lecture_halls = 1;
}

message CreateLectureHallAdminRequest {
  string name = 1;
  uint32 stream_protocol = 2;
  string comb_ip = 3;
  string pres_ip = 4;
  string cam_ip = 5;
  string camera_ip = 6;
  string pwr_ctrl_ip = 7;
}

message UpdateLectureHallAdminRequest {
  uint32 id = 1;
  string name = 2;
  uint32 stream_protocol = 3;
  string comb_ip = 4;
  string pres_ip = 5;
  string cam_ip = 6;
  string camera_ip = 7;
  string pwr_ctrl_ip = 8;
}

message DeleteLectureHallAdminRequest {
  uint32 id = 1;
}

message RefreshLectureHallPresetsAdminRequest {
  uint32 id = 1;
}

message SetDefaultCameraPresetAdminRequest {
  uint32 lecture_hall_id = 1;
  uint32 preset_id = 2;
}

message TakeCameraPresetSnapshotAdminRequest {
  uint32 lecture_hall_id = 1;
  uint32 preset_id = 2;
}

// The hall is not part of the request: it is the stream's, so a course's
// administrators cannot reach the camera of a room their stream is not in.
message SwitchCameraPresetRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  uint32 preset_id = 3;
}

// ----- The watch page -----
//
// Messages are named Watch* where they exist only for the watch page, so they do not
// collide with the lecture, course and chat messages that look alike.

message GetStreamWatchRequest {
  uint32 stream_id = 1;
  // The slug of the stream's course, as in the page's URL. Refused with 400 when it
  // is another course's, as getStream does.
  string slug = 2;
}

// Everything the watch page renders. The page's URL decides the layout (/w/{slug}/{id}
// with an optional COMB, PRES, CAM or SPLIT after it) and the client picks the views
// to play from `views`; default_layout is what to use when the URL names none.
message StreamWatch {
  WatchStream stream = 1;
  WatchCourse course = 2;

  // The sources the stream can be played from, with the course's source mode for the
  // stream's lecture hall already applied: a hall set to presentation only yields
  // just PRESENTATION, whatever else was recorded. Empty for a stream that is
  // neither live nor a recording.
  repeated WatchView views = 3;
  // The layout to open with when the URL names none: the caller's LECTURE_VIEW
  // setting, or the course's source mode forcing one, narrowed to what `views` can
  // show. Never SPLIT unless split_available. UNSPECIFIED when views is empty.
  WatchLayout default_layout = 4;
  // Whether the split view (presentation and camera side by side) can be offered:
  // both of those views are in `views`.
  bool split_available = 5;

  // The stored cut of a recording, in seconds into the recording: play from
  // start_offset and stop at end_offset. Absent for an uncut recording and for a live
  // stream. The client clips the player to it: the playlists in `views` are the whole
  // recording. (The old page appended the cut to the playlist URL as wowza
  // parameters, which nothing on the edge reads, so on a signed playlist it never
  // took effect.)
  optional uint32 start_offset = 6;
  optional uint32 end_offset = 7;

  // Stretches of the recording without speech, which the player offers to skip.
  repeated WatchSilence silences = 8;
  // Where playback starts for a viewer who skips the opening silence automatically,
  // as a fraction of the recording from 0 to 1: the end of the first silence, when
  // it begins at 0:00. Present only for a signed-in caller, on a recording held in a
  // lecture hall that has such a silence. It is the caller's AUTO_SKIP setting
  // (getUser) that says whether to use it; the client takes the larger of this and
  // `progress`. The fraction is of the scheduled length, as in the old page, so it
  // is slightly off for a recording that ran over or under.
  optional float first_silence_end_progress = 9;

  // Files the lecturer attached, served by GET /api/v2/streams/{stream_id}/files/{file_id}.
  repeated WatchAttachment attachments = 10;
  // Recordings the caller may download. Empty unless the stream is a recording and
  // the course allows downloads and the caller is signed in, or the caller
  // administers the course. The source mode applies as it does to `views`.
  repeated WatchDownload downloads = 11;

  // The caller's progress in this recording. Present only for a signed-in caller on
  // a recording.
  optional StreamProgress progress = 12;

  WatchChat chat = 13;
  WatchViewer viewer = 14;
  // Present only for a caller who administers the course.
  optional WatchAdmin admin = 15;

  // How many sockets are watching right now. Realtime ViewersEvents keep it current.
  uint32 viewers = 16;
  // Languages the recording has subtitles in, as getSubtitles takes them. Empty means
  // no transcript to offer.
  repeated string subtitle_languages = 17;
}

message WatchStream {
  uint32 id = 1;
  // As the lecturer set it; empty for an unnamed lecture.
  string name = 2;
  // name, or "Lecture: Jan 2, 2006" built from the start for an unnamed lecture.
  string display_name = 3;
  // Rendered from markdown and sanitised, as the description is everywhere else; safe
  // to inject. Realtime StreamDescriptionEvents replace it.
  string description_html = 4;
  google.protobuf.Timestamp start = 5;
  // Realtime StreamTimeChangedEvents move start and end.
  google.protobuf.Timestamp end = 6;
  // The stream is being broadcast now. Realtime StreamLiveEvents flip it.
  bool live_now = 7;
  // A recording is available to play.
  bool recording = 8;
  // The scheduled slot is over, or the stream was ended early.
  bool ended = 9;
  // Starts within the next half hour and has not started: the waiting room.
  bool is_coming_up = 10;
  // Not live, not recorded, not over and not yet coming up.
  bool is_planned = 11;
  // True for a private lecture, which only the course's administrators are ever sent.
  bool is_private = 12;
  // Name of the lecture hall the stream is held in; absent for a self-stream (OBS or
  // an upload). Sent to every caller who may watch.
  optional string lecture_hall_name = 13;
  // Length of the recording in seconds; absent until it has been processed.
  optional uint32 duration = 14;
}

message WatchCourse {
  uint32 id = 1;
  string name = 2;
  string slug = 3;
  uint32 year = 4;
  // S or W.
  string term = 5;
}

// Which source a view plays.
enum WatchViewKind {
  WATCH_VIEW_KIND_UNSPECIFIED = 0;
  // Presentation and camera in one picture.
  WATCH_VIEW_KIND_COMBINED = 1;
  WATCH_VIEW_KIND_PRESENTATION = 2;
  WATCH_VIEW_KIND_CAMERA = 3;
}

// How the page lays the views out; the last path segment of /w/{slug}/{id}/{layout}
// is COMB, PRES, CAM or SPLIT.
enum WatchLayout {
  WATCH_LAYOUT_UNSPECIFIED = 0;
  WATCH_LAYOUT_COMBINED = 1;
  WATCH_LAYOUT_PRESENTATION = 2;
  WATCH_LAYOUT_CAMERA = 3;
  // Presentation and camera in two players, kept in sync.
  WATCH_LAYOUT_SPLIT = 4;
}

message WatchView {
  WatchViewKind kind = 1;
  // The HLS playlist, signed for the caller and valid for seven hours; reload the
  // page's data to get a fresh one. Used as given: a literal {{quality}} in it is
  // the edge's to fill in, and is to be removed when the URL is shown to the user to
  // copy.
  string playlist_url = 2;
  // The seek-preview thumbnails of a recording, absent for a live stream and for a
  // recording whose sprite has not been generated.
  optional WatchSprite sprite = 3;
}

// A sheet of preview frames, one per interval, row by row.
message WatchSprite {
  // Fetched from GET /api/v2/streams/{stream_id}/files/{file_id}.
  uint32 file_id = 1;
  // Seconds of the recording between two frames.
  uint32 interval_seconds = 2;
}

// A stretch without speech, in seconds into the recording.
message WatchSilence {
  uint32 start = 1;
  uint32 end = 2;
}

message WatchAttachment {
  uint32 file_id = 1;
  string filename = 2;
  // Set when the lecturer linked to a page instead of uploading a file: open this
  // rather than fetching file_id.
  optional string external_url = 3;
}

message WatchDownload {
  WatchViewKind kind = 1;
  // "Combined", "Camera" or "Presentation".
  string friendly_name = 2;
  // A signed URL that downloads the recording.
  string url = 3;
}

// Whether and how the chat is offered. The chat's own reads and writes are
// ChatService; this is what to decide whether to show it at all.
message WatchChat {
  // The chat is on, for the course or for this stream, as sendChatMessage decides.
  bool enabled = 1;
  // Messages may be sent without showing the author's name.
  bool anonymous_allowed = 2;
  // Messages of non-administrators wait for approval before others see them.
  bool approval_required = 3;
}

message WatchViewer {
  bool signed_in = 1;
  bool is_course_admin = 2;
  // Whether reportStreamIssue can succeed: the deployment has an alert room, the
  // caller is signed in and the stream is held in a lecture hall.
  bool can_report_issue = 3;
}

// What only a course administrator is sent: the controls under the player.
message WatchAdmin {
  // The hall the stream is held in; absent for a self-stream.
  optional uint32 lecture_hall_id = 1;
  // The camera positions of the hall, to move the camera to with switchCameraPreset.
  // Empty unless the stream is live in a hall that has presets.
  repeated WatchCameraPreset camera_presets = 2;
  // Whether endStream is offered: the stream is live and held in a lecture hall. A
  // self-stream is ended by its streamer.
  bool can_end_stream = 3;
}

message WatchCameraPreset {
  // The camera's own numbering, as switchCameraPreset takes it.
  uint32 preset_id = 1;
  string name = 2;
  // A snapshot taken from the preset, or the placeholder when there is none; a path
  // on this server.
  string image_url = 3;
  bool is_default = 4;
}

message ListAllowedStreamReactionsRequest {
  uint32 stream_id = 1;
}

message ListAllowedStreamReactionsResponse {
  // Emoji, in display order.
  repeated string reactions = 1;
}

message AddStreamReactionRequest {
  uint32 stream_id = 1;
  // One of the emoji listAllowedStreamReactions lists.
  string reaction = 2;
}

// What the problem is about, as the report form offers it. Several may apply.
enum StreamIssueCategory {
  STREAM_ISSUE_CATEGORY_UNSPECIFIED = 0;
  STREAM_ISSUE_CATEGORY_VIDEO = 1;
  STREAM_ISSUE_CATEGORY_AUDIO = 2;
  STREAM_ISSUE_CATEGORY_CAMERA = 3;
  STREAM_ISSUE_CATEGORY_MICROPHONE = 4;
  STREAM_ISSUE_CATEGORY_LIGHT = 5;
  STREAM_ISSUE_CATEGORY_OTHER = 6;
}

message ReportStreamIssueRequest {
  uint32 stream_id = 1;
  repeated StreamIssueCategory categories = 2;
  // What went wrong. Required.
  string comment = 3;
  // How the operators can reach the reporter, all optional. The signed-in user is
  // attached to the report whatever is filled in.
  string name = 4;
  string email = 5;
  string phone = 6;
}

message ReportStreamSeekRequest {
  uint32 stream_id = 1;
  // Seconds into the recording that the viewer jumped to.
  double position = 2;
}

message GetStreamSeekHeatmapRequest {
  uint32 stream_id = 1;
}

message GetStreamSeekHeatmapResponse {
  // Into how many equal slices the recording is divided; bucket indexes run from 0
  // to bucket_count - 1.
  uint32 bucket_count = 1;
  // Only the slices that were jumped to; one missing has no hits. Empty while there
  // are too few seeks to show.
  repeated SeekHeatmapBucket buckets = 2;
}

message SeekHeatmapBucket {
  uint32 index = 1;
  uint32 hits = 2;
}

message SearchStreamSubtitlesRequest {
  uint32 stream_id = 1;
  // Three characters or more; shorter answers 400.
  string query = 2;
  // 10 by default, 100 at most.
  uint32 limit = 3;
}

message SearchStreamSubtitlesResponse {
  repeated StreamSubtitleHit hits = 1;
}

message StreamSubtitleHit {
  // Milliseconds into the recording.
  int64 timestamp = 1;
  // The lines before, of and after the match.
  string text_prev = 2;
  string text = 3;
  string text_next = 4;
}

message EndStreamRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  // Throw the recording away instead of keeping it.
  bool discard = 3;
}

// ----- Chat and realtime -----
//
// The chat's reads, and the events pushed over GET /api/v2/realtime. Names carry a
// Chat or Realtime prefix because `package protobuf` is shared with the runner's
// protos and `Chat` is already the personal-data export's.

service ChatService {
  rpc listChatMessages(ListChatMessagesRequest) returns (ListChatMessagesResponse) {
    option (google.api.http) = {get: "/streams/{stream_id}/chat/messages"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Chat"
      summary: "List a stream's chat messages."
      description:
        "The visible messages, with their replies. A course administrator also "
        "gets the messages still awaiting approval, and every caller their own."
    };
  }

  rpc getActivePoll(GetActiveChatPollRequest) returns (GetActiveChatPollResponse) {
    option (google.api.http) = {get: "/streams/{stream_id}/chat/polls/active"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Chat"
      summary: "Get a stream's running poll."
      description:
        "Empty when no poll is running. Vote counts are only filled in for the "
        "course's administrators; everyone else learns them when the poll closes."
    };
  }

  rpc listPolls(ListChatPollsRequest) returns (ListChatPollsResponse) {
    option (google.api.http) = {get: "/streams/{stream_id}/chat/polls"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Chat"
      summary: "List a stream's closed polls, newest first."
      description: "For the course's administrators."
    };
  }

  rpc listChatUsers(ListChatUsersRequest) returns (ListChatUsersResponse) {
    option (google.api.http) = {get: "/streams/{stream_id}/chat/users"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Chat"
      summary: "List the users who have written in a stream's chat."
      description: "For @-mentions. Anonymous messages do not put their author on the list."
    };
  }

  rpc sendChatMessage(SendChatMessageRequest) returns (SendChatMessageResponse) {
    option (google.api.http) = {
      post: "/streams/{stream_id}/chat/messages"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Chat"
      summary: "Write a message in a stream's chat."
      description:
        "Answers 429 while the caller is cooling down: more than five messages "
        "in two minutes, course administrators excepted. In a moderated chat the "
        "message waits for approval and only its author and the course's "
        "administrators see it. The message is also pushed over the realtime socket."
    };
  }

  rpc toggleChatReaction(ToggleChatReactionRequest) returns (ToggleChatReactionResponse) {
    option (google.api.http) = {
      post: "/streams/{stream_id}/chat/messages/{message_id}/reactions"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Chat"
      summary: "React to a message, or take the reaction back."
      description: "Reacting twice with the same emoji removes the reaction."
    };
  }

  rpc votePoll(VoteChatPollRequest) returns (VoteChatPollResponse) {
    option (google.api.http) = {
      post: "/streams/{stream_id}/chat/polls/votes"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Chat"
      summary: "Vote in a stream's running poll."
      description:
        "One vote per poll and user, final. 404 when the option is not part of the "
        "running poll, which includes a poll that has closed."
    };
  }

  rpc approveChatMessage(ApproveChatMessageRequest) returns (ApproveChatMessageResponse) {
    option (google.api.http) = {
      post: "/streams/{stream_id}/chat/messages/{message_id}/approve"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Chat"
      summary: "Approve a message, publishing it to every viewer."
      description:
        "For the course's administrators. Approving a message that is visible "
        "already changes nothing. The message is pushed as a ChatMessageEvent."
    };
  }

  rpc retractChatMessage(RetractChatMessageRequest) returns (RetractChatMessageResponse) {
    option (google.api.http) = {
      post: "/streams/{stream_id}/chat/messages/{message_id}/retract"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Chat"
      summary: "Hide an approved message again."
      description:
        "For the course's administrators. The message stays for them and its "
        "author, loses its reactions, and can be approved again."
    };
  }

  rpc deleteChatMessage(DeleteChatMessageRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/streams/{stream_id}/chat/messages/{message_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Chat"
      summary: "Delete a message for everyone."
      description: "For the course's administrators. The message's replies are deleted with it."
    };
  }

  rpc resolveChatMessage(ResolveChatMessageRequest) returns (ResolveChatMessageResponse) {
    option (google.api.http) = {
      post: "/streams/{stream_id}/chat/messages/{message_id}/resolve"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Chat"
      summary: "Mark a message as resolved."
      description: "For the course's administrators, for questions that have been answered."
    };
  }

  rpc startChatPoll(StartChatPollRequest) returns (StartChatPollResponse) {
    option (google.api.http) = {
      post: "/streams/{stream_id}/chat/polls"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Chat"
      summary: "Start a poll in a stream's chat."
      description:
        "For the course's administrators. 409 while another poll is running. "
        "Pushed to every viewer as a ChatPollStartedEvent."
    };
  }

  rpc closeChatPoll(CloseChatPollRequest) returns (CloseChatPollResponse) {
    option (google.api.http) = {
      post: "/streams/{stream_id}/chat/polls/active/close"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Chat"
      summary: "Close a stream's running poll."
      description:
        "For the course's administrators. Answers with the results, which are also "
        "pushed to every viewer as a ChatPollClosedEvent. 404 when no poll is running."
    };
  }
}

message ListChatMessagesRequest {
  uint32 stream_id = 1;
}

message ListChatMessagesResponse {
  // Top-level messages in the order they were written, replies nested under them.
  repeated ChatMessage messages = 1;
  // What the caller may do here, so that a client offers only that.
  ChatAccess access = 2;
}

// What the caller can do in a stream's chat. The server checks every write for itself;
// this only drives what the interface offers.
message ChatAccess {
  // Signed in, and the chat is on. Anonymous viewers read only.
  bool can_write = 1;
  // Administers the stream's course: may approve, retract, delete and resolve
  // messages and run polls, and sees the messages awaiting approval.
  bool can_moderate = 2;
  // The course allows anonymous messages.
  bool anonymous_allowed = 3;
  // The course holds messages back until an administrator approves them.
  bool moderated = 4;
}

message GetActiveChatPollRequest {
  uint32 stream_id = 1;
}

message GetActiveChatPollResponse {
  // Unset when no poll is running.
  ChatPoll poll = 1;
}

message ListChatPollsRequest {
  uint32 stream_id = 1;
}

message ListChatPollsResponse {
  repeated ChatPoll polls = 1;
}

message SendChatMessageRequest {
  uint32 stream_id = 1;
  // At most 1000 bytes once trimmed, and not empty.
  string text = 2;
  // A top-level message of the same stream; replies cannot be replied to.
  optional uint32 reply_to = 3;
  // Hides the author's name from the other viewers. Refused with 400 where the
  // course does not allow anonymous messages, rather than posting under the name.
  bool anonymous = 4;
  // Users to @-mention, at most 20.
  repeated uint32 addressed_to = 5;
}

message SendChatMessageResponse {
  // As stored. Also pushed to the stream's viewers as a ChatMessageEvent.
  ChatMessage message = 1;
}

message ToggleChatReactionRequest {
  uint32 stream_id = 1;
  uint32 message_id = 2;
  // One of +1, -1, smile, tada, confused, heart, eyes.
  string emoji = 3;
}

message ToggleChatReactionResponse {
  // The message's reactions after the toggle, as pushed in the ChatReactionsEvent.
  repeated ChatReactionSummary reactions = 1;
}

message VoteChatPollRequest {
  uint32 stream_id = 1;
  uint32 poll_option_id = 2;
}

message VoteChatPollResponse {
  // The poll with the caller's vote; vote counts as in getActivePoll.
  ChatPoll poll = 1;
}

// The moderation calls name the stream as well as the message, so that a message of
// another stream is no message here.
message ApproveChatMessageRequest {
  uint32 stream_id = 1;
  uint32 message_id = 2;
}

message ApproveChatMessageResponse {
  ChatMessage message = 1;
}

message RetractChatMessageRequest {
  uint32 stream_id = 1;
  uint32 message_id = 2;
}

message RetractChatMessageResponse {
  ChatMessage message = 1;
}

message DeleteChatMessageRequest {
  uint32 stream_id = 1;
  uint32 message_id = 2;
}

message ResolveChatMessageRequest {
  uint32 stream_id = 1;
  uint32 message_id = 2;
}

message ResolveChatMessageResponse {
  ChatMessage message = 1;
}

message StartChatPollRequest {
  uint32 stream_id = 1;
  // At most 500 characters once trimmed, and not empty.
  string question = 2;
  // Two to ten answers of at most 200 characters each, none empty.
  repeated string answers = 3;
}

message StartChatPollResponse {
  // With every count at 0.
  ChatPoll poll = 1;
}

message CloseChatPollRequest {
  uint32 stream_id = 1;
}

message CloseChatPollResponse {
  // The poll as closed, with its final vote counts.
  ChatPoll poll = 1;
}

message ListChatUsersRequest {
  uint32 stream_id = 1;
}

message ListChatUsersResponse {
  repeated ChatUser users = 1;
}

message ChatUser {
  uint32 id = 1;
  string name = 2;
}

// All reactions with one emoji on one message.
message ChatReactionSummary {
  // The emoji's short name, e.g. "+1" or "tada".
  string emoji = 1;
  uint32 count = 2;
  // Who reacted, so a client can tell whether its own user is among them.
  repeated uint32 user_ids = 3;
  repeated string user_names = 4;
}

message ChatMessage {
  uint32 id = 1;
  // 0 on an anonymous message, unless the caller wrote it.
  uint32 user_id = 2;
  // "Anonymous" on an anonymous message.
  string user_name = 3;
  // The name's colour, derived from the author's id.
  string color = 4;
  // Sanitised HTML: escaped text with links turned into anchors. Safe to render.
  string message_html = 5;
  // The text as written. Never render it as HTML.
  string message_text = 6;
  // Written by one of the course's administrators.
  bool admin = 7;
  // False while the message awaits approval in a moderated chat, or once retracted
  // (see retracted).
  bool visible = 8;
  bool resolved = 9;
  // The message this one replies to; 0 when it is not a reply.
  uint32 reply_to = 10;
  repeated uint32 addressed_to = 11;
  google.protobuf.Timestamp created_at = 12;
  repeated ChatReactionSummary reactions = 13;
  // Only on top-level messages: replies cannot be replied to.
  repeated ChatMessage replies = 14;
  // An administrator took the message back after it was shown. Not visible either way;
  // this tells it from one still awaiting approval.
  bool retracted = 15;
}

message ChatPollOption {
  uint32 id = 1;
  string answer = 2;
  // 0 where the caller may not see the count yet.
  uint32 votes = 3;
}

message ChatPoll {
  uint32 id = 1;
  string question = 2;
  bool active = 3;
  repeated ChatPollOption options = 4;
  // The option the caller voted for; 0 when they have not, or are anonymous.
  uint32 voted_option_id = 5;
}

// One frame on the realtime socket (GET /api/v2/realtime?stream=<id>), protojson
// encoded. Server to client only.
message RealtimeEvent {
  // Who an event is for. The socket drops what its user is not in the audience of.
  enum Audience {
    // Delivered to nobody: forgetting to set an audience must not broadcast.
    AUDIENCE_UNSPECIFIED = 0;
    AUDIENCE_ALL = 1;
    // The course's administrators, and audience_user_id when it is set: a message
    // awaiting moderation goes to the moderators and its author.
    AUDIENCE_COURSE_ADMINS = 2;
    // audience_user_id alone.
    AUDIENCE_USER = 3;
  }

  uint32 stream_id = 1;
  google.protobuf.Timestamp at = 2;
  Audience audience = 3;
  uint32 audience_user_id = 4;

  oneof event {
    // A new message, or one just approved. Clients upsert by id.
    ChatMessageEvent message = 10;
    ChatMessageDeletedEvent message_deleted = 11;
    ChatMessageResolvedEvent message_resolved = 12;
    ChatMessageRetractedEvent message_retracted = 13;
    ChatReactionsEvent reactions = 14;
    ChatPollStartedEvent poll_started = 15;
    ChatPollClosedEvent poll_closed = 16;
    // Course administrators only.
    ChatPollVoteEvent poll_vote = 17;
    ViewersEvent viewers = 18;
    StreamLiveEvent live = 19;
    StreamTitleEvent title = 20;
    StreamDescriptionEvent description = 21;
    // Events were lost; re-fetch everything.
    ResyncEvent resync = 22;
    // Course administrators only.
    StreamReactionEvent stream_reaction = 23;
    // Course administrators only.
    StreamReactionStatsEvent stream_reaction_stats = 24;
    StreamTimeChangedEvent time_changed = 25;
  }
}

message ChatMessageEvent {
  ChatMessage message = 1;
}

// Deleting a message deletes its replies with it.
message ChatMessageDeletedEvent {
  uint32 message_id = 1;
}

message ChatMessageResolvedEvent {
  uint32 message_id = 1;
}

// The message is hidden again, marked retracted, and its reactions are gone.
message ChatMessageRetractedEvent {
  uint32 message_id = 1;
}

// The message's reactions in full, replacing what the client had.
message ChatReactionsEvent {
  uint32 message_id = 1;
  repeated ChatReactionSummary reactions = 2;
}

message ChatPollStartedEvent {
  ChatPoll poll = 1;
}

// Carries the final vote counts.
message ChatPollClosedEvent {
  ChatPoll poll = 1;
}

message ChatPollVoteEvent {
  uint32 poll_option_id = 1;
  uint32 votes = 2;
}

// How many sockets are watching the stream.
message ViewersEvent {
  uint32 viewers = 1;
}

// The stream went live, or stopped being. live = false is also how the end of a
// broadcast arrives (it was ended early, or its slot ran out): there is no separate
// event. What follows -- a recording appearing, the stream counted as ended -- is
// read by fetching getStreamWatch again, which is what the old page did by reloading.
message StreamLiveEvent {
  bool live = 1;
}

// A viewer reacted to a live stream. Sent to every viewer: the emoji floats over the
// picture, and the lecturer's reaction display highlights it for a moment. It says
// nothing about who reacted, and a burst of the same emoji is coalesced to one event
// per second.
message StreamReactionEvent {
  string reaction = 1;
}

// How the reactions of the last window split over the emoji, sent every five
// seconds while at least one administrator is watching and there were reactions.
message StreamReactionStatsEvent {
  repeated StreamReactionShare shares = 1;
  // The window the shares were counted over.
  uint32 window_seconds = 2;
}

message StreamReactionShare {
  string reaction = 1;
  uint32 count = 2;
  // count over the window's total, from 0 to 1.
  float share = 3;
}

// The lecture was rescheduled while the page was open. Clients replace the stream's
// start and end, and what they derive from them: the countdown, the time left.
message StreamTimeChangedEvent {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

message StreamTitleEvent {
  string title = 1;
}

message StreamDescriptionEvent {
  // Rendered and sanitised, as the stream's description is everywhere else.
  string html = 1;
}

message ResyncEvent {
  string reason = 1;
}

///////////////////////////////
//// SEARCH, TOKENS, ONBOARDING
///////////////////////////////

message SearchRequest {
  string query = 1;
  // Per kind of hit; 10 by default, 100 at most.
  uint32 limit = 2;
  // Semesters written like 2022S. Wins over the range below.
  repeated string semesters = 3;
  string first_semester = 4;
  string last_semester = 5;
  // Courses written like brauereiwesen2022S, at most three.
  repeated string courses = 6;
  // Find courses only, never lectures, as the start page's search box does.
  bool courses_only = 7;
}

message SearchCourseHit {
  string name = 1;
  string slug = 2;
  uint32 year = 3;
  string term = 4;
}

message SearchStreamHit {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  string course_name = 4;
  string course_slug = 5;
  uint32 year = 6;
  string term = 7;
}

message SearchSubtitleHit {
  uint32 stream_id = 1;
  // Milliseconds into the recording.
  int64 timestamp = 2;
  string text_prev = 3;
  string text = 4;
  string text_next = 5;
  string stream_name = 6;
  google.protobuf.Timestamp stream_start = 7;
  google.protobuf.Timestamp stream_end = 8;
  string course_name = 9;
  string course_slug = 10;
  uint32 year = 11;
  string term = 12;
}

message SearchResponse {
  repeated SearchCourseHit courses = 1;
  repeated SearchStreamHit streams = 2;
  repeated SearchSubtitleHit subtitles = 3;
}

message CourseTokenRequest {
  string token = 1;
}

message CourseByToken {
  uint32 id = 1;
  string name = 2;
  string slug = 3;
  uint32 year = 4;
  string term = 5;
  // Opted out earlier: the course is soft-deleted and opting in restores it.
  bool opted_out = 6;
}

message PasswordResetKeyRequest {
  string key = 1;
}

message SetPasswordByResetKeyRequest {
  string key = 1;
  string password = 2;
}

message CreateFirstUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message GetIntegrationResponse {
  uint32 id = 1;
  string name = 2;
  string return_url = 3;
}

message ListCourseIntegrationGrantsRequest {
  uint32 course_id = 1;
}

message CourseIntegrationGrant {
  uint32 id = 1;
  string name = 2;
}

message ListCourseIntegrationGrantsResponse {
  repeated CourseIntegrationGrant grants = 1;
}

message RevokeCourseIntegrationGrantRequest {
  uint32 course_id = 1;
  uint32 grant_id = 2;
}

message GetIntegrationAuthorizationRequest {
  uint32 integration_id = 1;
  string state = 2;
}

message AuthorizableCourse {
  uint32 id = 1;
  string name = 2;
  string teaching_term = 3;
  uint32 year = 4;
}

message IntegrationAuthorization {
  string integration_name = 1;
  // The signed-in user's preferred name, shown so they notice a wrong account.
  string user_name = 2;
  repeated AuthorizableCourse courses = 3;
}

enum IntegrationAuthorizationDecision {
  INTEGRATION_AUTHORIZATION_DECISION_UNSPECIFIED = 0;
  INTEGRATION_AUTHORIZATION_DECISION_APPROVE = 1;
  INTEGRATION_AUTHORIZATION_DECISION_CANCEL = 2;
}

message DecideIntegrationAuthorizationRequest {
  uint32 integration_id = 1;
  string state = 2;
  IntegrationAuthorizationDecision decision = 3;
  // Required to approve, ignored to cancel.
  uint32 course_id = 4;
}

message DecideIntegrationAuthorizationResponse {
  string redirect_url = 1;
}
