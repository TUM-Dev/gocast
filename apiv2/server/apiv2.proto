syntax = "proto3";
package protobuf;

import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "./apiv2/protobuf";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "gocast API"
    version: "2.0"
    description:
      "The shiny new gocast API!\nThis API is designed to be a "
      "user-friendly and easy-to-use interface for third party "
      "services.\nIt provides access to all non-administrative "
      "features of the GoCast platform.\nMake sure to log in to "
      "TUM-Live before making any requests that need "
      "authentication via these docs."
    contact: {
      name: "TUM-Developers - gocast"
      url: "https://github.com/TUM-Dev/gocast"
    }
    license: {
      name: "MIT"
      url: "https://github.com/TUM-Dev/gocast/blob/main/LICENSE"
    }
  }
  schemes: [
    HTTP,
    HTTPS
  ]
  base_path: "/api/v2"
  host: "tum.live"
  consumes: "application/json"
  produces: "application/json"
};

// The API is split into one service per domain. The split is for grouping only:
// every method keeps the HTTP path in its google.api.http annotation and the tag in
// its openapiv2_operation, so neither the REST surface nor the generated docs change
// shape. All four are served by the same process and registered on the same gateway
// mux.

// Endpoints that describe the deployment rather than any resource in it.
service MetaService {
  rpc healthCheck(google.protobuf.Empty) returns (HealthCheckResponse) {
    option (google.api.http) = {get: "/status"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "API Status"
      summary: "API healthcheck ."
      description:
        "If this endpoint does not return 200, the API is "
        "experiencing a catastrophic outage."
    };
  }

  rpc getFrontendConfig(google.protobuf.Empty) returns (GetFrontendConfigResponse) {
    option (google.api.http) = {get: "/config"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "API Status"
      summary: "Get the frontend configuration."
      description:
        "Returns the deployment's branding, version and links. Answers "
        "before anyone has signed in, because the frontend needs it to "
        "render its shell."
    };
  }

  rpc getSemesters(google.protobuf.Empty) returns (GetSemestersResponse) {
    option (google.api.http) = {get: "/semesters"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Semesters"
      summary: "Get available semesters."
      description:
        "Retrieves all available semesters and the current "
        "semester."
    };
  }

  rpc getNotifications(google.protobuf.Empty) returns (GetNotificationsResponse) {
    option (google.api.http) = {get: "/notifications"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Notifications"
      summary: "Get notifications."
      description: "Retrieves notifications for the current user."
    };
  }

  rpc getServerNotifications(google.protobuf.Empty) returns (GetServerNotificationsResponse) {
    option (google.api.http) = {get: "/server-notifications"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Notifications"
      summary: "Get server notifications."
      description: "Retrieves current server notifications."
    };
  }

  rpc getInfoPage(GetInfoPageRequest) returns (GetInfoPageResponse) {
    option (google.api.http) = {get: "/info-pages/{name}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Info Pages"
      summary: "Get an info page."
      description:
        "Returns an info page - the privacy policy, imprint, about page, "
        "or any further page an administrator has added - as sanitised "
        "HTML. Public: these are pages a visitor reads before deciding to "
        "sign in."
    };
  }

  rpc listInfoPages(google.protobuf.Empty) returns (ListInfoPagesResponse) {
    option (google.api.http) = {get: "/info-pages"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Info Pages"
      summary: "List the available info pages."
      description:
        "Retrieves every info page's slug and title, without its content. "
        "Public, so a client can find pages an administrator has added "
        "without a redeploy."
    };
  }

  rpc getIntegration(google.protobuf.Empty) returns (GetIntegrationResponse) {
    option (google.api.http) = {get: "/integration"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Integrations"
      summary: "Check integration credentials."
      description: "Returns the integration authenticated by the bearer API key."
    };
  }
}

// The signed-in user's own account, and the endpoints the login page needs
// before anyone is signed in.
service UserService {
  rpc getUser(google.protobuf.Empty) returns (GetUserResponse) {
    option (google.api.http) = {get: "/users/me"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "User"
      summary: "Get user."
      description: "Retrieves the current user."
    };
  }

  rpc updateUserSettings(UpdateUserSettingsRequest) returns (UpdateUserSettingsResponse) {
    option (google.api.http) = {
      patch: "/users/settings"
      body: "*"
      response_body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "User"
      summary: "Update the current user's settings."
      description: "Updates the current user's settings."
    };
  }

  rpc exportPersonalData(google.protobuf.Empty) returns (ExportPersonalDataResponse) {
    option (google.api.http) = {get: "/users/export"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "User"
      summary: "Export user data."
      description: "Exports the current user's data."
    };
  }

  rpc resetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (google.api.http) = {
      post: "/users/reset-password"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "User"
      summary: "Reset user password."
      description: "Resets the user password."
    };
  }

  // ----- Password reset and onboarding -----
  // Both serve anonymous callers: the mailed key, or an empty users table, is the
  // credential.

  rpc checkPasswordResetKey(PasswordResetKeyRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {get: "/users/password-reset/{key}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "User"
      summary: "Check a password reset key."
      description: "Answers 404 when the key was never issued or has been used, so the set-password page can say so instead of showing a form that cannot work."
    };
  }

  rpc setPasswordByResetKey(SetPasswordByResetKeyRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/users/password-reset/{key}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "User"
      summary: "Set a password with a reset key."
      description: "Sets the password of the user the key was mailed to (at least 8 characters, 400 otherwise) and spends the key. 404 for an unknown or used key."
    };
  }

  rpc createFirstUser(CreateFirstUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/users/first"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "User"
      summary: "Create the first administrator of a fresh deployment."
      description: "Only while the users table is empty (getFrontendConfig's isFreshInstallation); 403 afterwards. The user is a server administrator with the given password."
    };
  }

  rpc getLoginOptions(google.protobuf.Empty) returns (GetLoginOptionsResponse) {
    option (google.api.http) = {get: "/login-options"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "User"
      summary: "Get available login methods."
      description: "Reports whether single sign-on is configured, so that a login page knows which options to offer. Requires no authentication."
    };
  }
}

// Courses and the caller's relationship to them.
service CourseService {
  rpc getPublicCourses(GetPublicCoursesRequest) returns (GetPublicCoursesResponse) {
    option (google.api.http) = {get: "/courses"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Get public courses."
      description: "Retrieves the public courses for a given semester."
    };
  }

  rpc getCourseBySlug(GetCourseBySlugRequest) returns (GetCourseBySlugResponse) {
    option (google.api.http) = {get: "/courses/{slug}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Get course by slug."
      description: "Retrieves a course by its slug, year, and term."
    };
  }

  // ----- Search and course tokens -----

  rpc search(SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {get: "/search"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Search courses, lectures and subtitles."
      description: "Finds what the caller may see, anonymous callers included. Without a scope every semester's courses are searched; `semesters` (written 2022S) or `first_semester` with `last_semester` narrow that, and a single semester also finds lectures. Naming up to three `courses` (written brauereiwesen2022S) searches their lectures and subtitle lines instead, hidden courses included, and answers 404 for one the caller may not watch. `limit` is per kind, 10 by default and 100 at most. 503 while Meilisearch is unreachable."
    };
  }

  rpc getCourseByToken(CourseTokenRequest) returns (CourseByToken) {
    option (google.api.http) = {
      post: "/courses/by-token"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Name the course a token opens."
      description: "The token is mailed to a course's lecturer when it is imported from TUMOnline, before they need an account; it is the credential here. The body carries it so it stays out of logs. 404 for an unknown token."
    };
  }

  rpc optInCourseByToken(CourseTokenRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/courses/by-token/opt-in"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Switch an imported course on."
      description: "Makes the course visible to anyone signed in, with recordings, and restores it if it was opted out before. Whoever is signed in is named in the audit entry."
    };
  }

  rpc optOutCourseByToken(CourseTokenRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/courses/by-token/opt-out"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Delete an imported course the lecturer does not want."
      description: "Soft-deletes the course and its lectures; opting in again restores the course. Whoever is signed in is named in the audit entry."
    };
  }

  rpc getUserCourses(GetUserCoursesRequest) returns (GetUserCoursesResponse) {
    option (google.api.http) = {get: "/courses/enrolled"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Get user courses."
      description:
        "Retrieves the enrolled courses for a user for a given "
        "semester."
    };
  }

  rpc getPinnedCourses(google.protobuf.Empty) returns (GetPinnedCoursesResponse) {
    option (google.api.http) = {get: "/courses/pinned"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Get pinned courses."
      description: "Retrieves the pinned courses for a user."
    };
  }

  rpc getLiveCourses(google.protobuf.Empty) returns (GetLiveCoursesResponse) {
    option (google.api.http) = {get: "/courses/live"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Get currently live courses with streams."
      description: "Retrieves the currently live courses with their streams."
    };
  }

  rpc getPinForCourse(GetPinForCourseRequest) returns (GetPinForCourseResponse) {
    option (google.api.http) = {get: "/courses/{course_id}/pin"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Get pin for course."
      description: "Checks if the user has pinned the course."
    };
  }

  rpc pinCourse(PinCourseRequest) returns (PinCourseResponse) {
    option (google.api.http) = {
      post: "/courses/{course_id}/pin"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Pin or unpin a course."
      description: "Pins or unpins a course for the user."
    };
  }

  // The course's own counterparts of getServerStats/exportServerStats, for its
  // lecturers. The charts and the export carry the same series, scoped to the course.
  rpc getCourseStats(GetCourseStatsRequest) returns (CourseStatsResponse) {
    option (google.api.http) = {get: "/courses/{course_id}/stats"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Get a course's usage statistics."
      description: "Returns the quick counters and charted viewer activity of one course. Requires administering the course."
    };
  }

  rpc exportCourseStats(ExportCourseStatsRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/courses/{course_id}/stats/export"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Export a course's usage statistics."
      description: "Bundles the same data getCourseStats returns as a single downloadable file, as JSON or CSV. Requires administering the course."
    };
  }

  rpc getLectureStats(GetLectureStatsRequest) returns (LectureStatsResponse) {
    option (google.api.http) = {get: "/courses/{course_id}/streams/{stream_id}/stats"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Get one lecture's usage statistics."
      description: "Returns the viewer counters and charted activity of one of the course's lectures. Requires administering the course."
    };
  }

  // Creating a course is open to every lecturer, not only to administrators of an
  // existing one; the creator becomes its administrator.
  rpc createCourse(CreateCourseRequest) returns (CreateCourseResponse) {
    option (google.api.http) = {
      post: "/courses"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Create a course."
      description: "Creates a course visible to signed-in users, with VoDs on and downloads and chat off, and makes the caller its administrator. Requires the lecture permission. Answers 409 if the semester already has a course with the slug."
    };
  }

  rpc searchTumOnlineCourses(SearchTumOnlineCoursesRequest) returns (SearchTumOnlineCoursesResponse) {
    option (google.api.http) = {get: "/tumonline-courses"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Search TUMOnline's courses."
      description: "Searches the courses prefetched from TUMOnline, to fill in a new course. Requires the lecture permission. Answers 503 when the search backend is unavailable."
    };
  }

  // The administration schedule: the lectures of the courses the caller administers
  // (every course, for someone who may view them all), in a window of their choosing.
  rpc getSchedule(GetScheduleRequest) returns (GetScheduleResponse) {
    option (google.api.http) = {get: "/schedule"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Get the lecture schedule."
      description: "Returns the lectures overlapping [from, to) -- at most 100 days -- of the courses the caller administers, optionally only in some lecture halls. Requires the lecture permission."
    };
  }

  rpc listScheduleLectureHalls(google.protobuf.Empty) returns (ListScheduleLectureHallsResponse) {
    option (google.api.http) = {get: "/schedule/lecture-halls"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "List the lecture halls the schedule can be filtered by."
      description: "Names and IDs only; listLectureHallsAdmin has the rest. Requires the lecture permission."
    };
  }

  rpc updateLecture(UpdateLectureRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/courses/{course_id}/streams/{stream_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Change one of a course's lectures."
      description: "Sets the fields that are present and leaves the rest: name, description, start and end (both or neither, end after start), lecture hall (0 for none), chat and visibility. The lecture must be one of the course's. Requires administering the course; setting the lecture hall also requires being a server administrator (403 otherwise, nothing saved). Unlike v1, viewers watching at the time are not told; they see the change on reload."
    };
  }

  // ----- Lecture administration -----
  // The course page's lecture management. Every one of these checks the lecture
  // named is one of the course's and answers 404 for any other.

  rpc listCourseLecturesAdmin(ListCourseLecturesAdminRequest) returns (ListCourseLecturesAdminResponse) {
    option (google.api.http) = {get: "/courses/{course_id}/lectures/admin"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "List a course's lectures for its administrators."
      description: "Every lecture of the course, newest first, with what managing it needs: times, hall, series, stream key, state, files, sections and transcoding progress. Requires administering the course."
    };
  }

  rpc updateLectureSeries(UpdateLectureSeriesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/courses/{course_id}/streams/{stream_id}/series"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Change every lecture of a lecture's series."
      description: "Sets the fields that are present on every lecture of the course sharing the lecture's series, the lecture included. Answers 400 for a lecture in no series. Requires administering the course; setting the lecture hall also requires being a server administrator (403 otherwise, nothing saved)."
    };
  }

  rpc updateLectureSeriesTime(UpdateLectureSeriesTimeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/courses/{course_id}/streams/{stream_id}/series/time"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Move a lecture and its whole series to a new time of day."
      description: "Sets the lecture's start and end, then gives every other lecture of the course in its series the same time of day and duration, each on its own date. Answers 400 for a lecture in no series. Requires administering the course."
    };
  }

  // Server administrators only: a hall is shared across courses.
  rpc updateLecturesLectureHall(UpdateLecturesLectureHallRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/courses/{course_id}/streams/lecture-hall"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Move some of a course's lectures to a lecture hall."
      description: "Sets the hall of every lecture named, 0 for none (self-streamed). Changes nothing unless every lecture is the course's (404) and the hall exists (400). Requires administering the course and being a server administrator."
    };
  }

  rpc deleteLectures(DeleteLecturesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/courses/{course_id}/streams/delete"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Delete some of a course's lectures."
      description: "Deletes nothing unless every lecture named is one of the course's. Requires administering the course."
    };
  }

  rpc deleteLectureSeries(DeleteLectureSeriesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/courses/{course_id}/streams/{stream_id}/series"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Delete a lecture and the rest of its series."
      description: "Deletes every lecture of the course sharing the lecture's series. Answers 400 for a lecture in no series. Requires administering the course."
    };
  }

  rpc copyLecture(CopyLectureRequest) returns (CopyLectureResponse) {
    option (google.api.http) = {
      post: "/courses/{course_id}/streams/{stream_id}/copy"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Copy or move a lecture to another course."
      description: "Creates a copy of the lecture in the target course and, with move, then deletes the original. Requires administering both courses; a target the caller does not administer answers 404, as a missing one does."
    };
  }

  // The upload of a VOD_UPLOAD lecture's recording sits beside the gateway, as the
  // attachment and thumbnail uploads do, since it is a multipart body:
  // POST /courses/{course_id}/streams/{stream_id}/media?type=COMB|PRES|CAM, the video
  // in the form field `file`. Authorized as these RPCs are, a caller who does not
  // administer the course answered 404, before anything of the body is read. The body
  // is then streamed to the least busy worker, which transcodes it and attaches the
  // result to the lecture as that version. Answers {} once the worker has the file;
  // 400 for a missing or unknown type, 409 while the lecture is live, 503 when no
  // worker is alive or the one chosen cannot be reached.
  rpc createLectures(CreateLecturesRequest) returns (CreateLecturesResponse) {
    option (google.api.http) = {
      post: "/courses/{course_id}/streams"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Create a lecture, or a series of them, in a course."
      description: "Creates one lecture at start, plus one more per date in date_series, all sharing a new series identifier when there is more than one. Each runs duration_minutes from its start. The kind decides what the lecture is: a LIVESTREAM is streamed from its lecture hall, or with hall 0 by the lecturer with the stream key it gets; a VOD_UPLOAD waits for its recording to be uploaded (POST .../streams/{stream_id}/media); a PREMIERE is a recording a worker streams as if live at start, from a file the server expects under mass storage. A VOD_UPLOAD or PREMIERE takes no hall (400) and may leave duration_minutes 0, which gives it an hour in the schedule. ad_hoc starts a livestream two minutes from now, ignoring start, and takes no date_series. A missing title, start or (for a livestream) duration, a repeated date and an unknown hall answer 400. Creates all or nothing, and answers the created lectures. Requires administering the course."
    };
  }

  // ----- Course administration -----
  // The course page's settings, admins, lecture-hall sources and participants. The
  // course-scoped ones require administering the course; course 0 answers 404.

  rpc getCourseAdmin(GetCourseAdminRequest) returns (CourseAdmin) {
    option (google.api.http) = {get: "/courses/{course_id}/admin"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "Get a course's settings."
      description: "What the course's settings tab shows and edits. Requires administering the course."
    };
  }

  rpc listCourseIntegrationGrants(ListCourseIntegrationGrantsRequest) returns (ListCourseIntegrationGrantsResponse) {
    option (google.api.http) = {get: "/courses/{course_id}/integrations"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "List applications authorized for a course."
      description: "Lists active grants. Requires administering the course."
    };
  }

  rpc revokeCourseIntegrationGrant(RevokeCourseIntegrationGrantRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/courses/{course_id}/integrations/{grant_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "Revoke an application's access to a course."
      description: "Revokes the active grant belonging to this course. Requires administering the course. A missing or revoked grant answers 404."
    };
  }

  rpc updateCourseSettings(UpdateCourseSettingsRequest) returns (CourseAdmin) {
    option (google.api.http) = {
      patch: "/courses/{course_id}/settings"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "Change a course's settings."
      description: "Sets the fields that are present and leaves the rest. Requires administering the course."
    };
  }

  rpc copyCourse(CopyCourseRequest) returns (CopyCourseResponse) {
    option (google.api.http) = {
      post: "/courses/{course_id}/copy"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "Copy a course into another semester."
      description: "Copies the course's settings, every one of its lectures and its administrators into a new course in the given semester. Requires administering the course. Answers 409 if that semester already has a course with the slug."
    };
  }

  rpc deleteCourse(DeleteCourseRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/courses/{course_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "Delete a course and its lectures."
      description: "Requires administering the course."
    };
  }

  rpc listCourseAdmins(ListCourseAdminsRequest) returns (ListCourseAdminsResponse) {
    option (google.api.http) = {get: "/courses/{course_id}/admins"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "List a course's administrators."
      description: "Those granted the course explicitly; neither its owner nor the server's administrators are listed unless they were. Requires administering the course."
    };
  }

  rpc addCourseAdmin(AddCourseAdminRequest) returns (CourseAdminUser) {
    option (google.api.http) = {
      post: "/courses/{course_id}/admins"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "Make a user an administrator of a course."
      description: "A student or external participant is promoted to lecturer, as v1 did. Requires administering the course."
    };
  }

  rpc removeCourseAdmin(RemoveCourseAdminRequest) returns (CourseAdminUser) {
    option (google.api.http) = {delete: "/courses/{course_id}/admins/{user_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "Remove an administrator from a course."
      description: "Answers 400 for the course's last administrator and 404 for someone who is not one. Requires administering the course."
    };
  }

  rpc searchUsersForCourse(SearchUsersForCourseRequest) returns (SearchUsersForCourseResponse) {
    option (google.api.http) = {get: "/courses/{course_id}/admins/search"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "Find a user to make an administrator of a course."
      description: "Matches name, login and email; at least three letters or digits. At most ten results. Requires administering the course."
    };
  }

  rpc listCourseLectureHallSettings(ListCourseLectureHallSettingsRequest) returns (ListCourseLectureHallSettingsResponse) {
    option (google.api.http) = {get: "/courses/{course_id}/lecture-halls"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "List the course's source settings per lecture hall."
      description: "One entry per hall the course has a lecture in: which sources to stream and which camera preset to use. Requires administering the course."
    };
  }

  rpc updateCourseLectureHallSettings(UpdateCourseLectureHallSettingsRequest) returns (ListCourseLectureHallSettingsResponse) {
    option (google.api.http) = {
      put: "/courses/{course_id}/lecture-halls"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "Replace the course's source settings per lecture hall."
      description: "Replaces every hall's settings with the ones sent; a hall left out goes back to the defaults. Requires administering the course."
    };
  }

  rpc listCourseParticipants(ListCourseParticipantsRequest) returns (ListCourseParticipantsResponse) {
    option (google.api.http) = {get: "/courses/{course_id}/participants"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "List the external participants invited to a course."
      description: "Accounts without a TUM login that were invited by email. Requires administering the course."
    };
  }

  rpc inviteCourseParticipants(InviteCourseParticipantsRequest) returns (InviteCourseParticipantsResponse) {
    option (google.api.http) = {
      post: "/courses/{course_id}/participants"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "Invite external participants to a course by email."
      description: "An address without an account gets one and an email to set its password; an existing account is enrolled and notified. At most 200 per call. Requires administering the course."
    };
  }

  // The sidebar's tree of courses; a flat list, grouped by semester by the caller.
  rpc listAdministeredCourses(google.protobuf.Empty) returns (ListAdministeredCoursesResponse) {
    option (google.api.http) = {get: "/courses/administered"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Administration"
      summary: "List the courses the caller administers."
      description: "Every semester's; every course for someone who administers them all. Requires the lecture permission."
    };
  }

  // ----- Lecture administration, part 2 -----
  // What the lecture card does to a lecture's content. Every one of these checks the
  // lecture named is one of the course's and answers 404 for any other; a section or
  // file named must also be that lecture's.
  //
  // Two uploads sit beside the gateway rather than in it, because it cannot take a
  // multipart body: POST /courses/{course_id}/streams/{stream_id}/attachments and
  // POST /courses/{course_id}/streams/{stream_id}/thumbnail, each a multipart form with
  // the file in `file`, authorized as these RPCs are and answering the created file as
  // a LectureFileAdmin. A third, the recording of a VOD_UPLOAD lecture
  // (POST .../streams/{stream_id}/media), is described at createLectures.

  rpc createLectureSections(CreateLectureSectionsRequest) returns (CreateLectureSectionsResponse) {
    option (google.api.http) = {
      post: "/courses/{course_id}/streams/{stream_id}/sections"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Add chapters to a lecture."
      description: "Creates the sections and answers all of the lecture's sections, in order. Minutes and seconds must be below 60 and every section needs a description. The sections' thumbnails are generated afterwards, by a runner or else a worker. Requires administering the course."
    };
  }

  rpc updateLectureSection(UpdateLectureSectionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/courses/{course_id}/streams/{stream_id}/sections/{section_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Change one of a lecture's chapters."
      description: "Replaces the section's description and start. A moved start has its thumbnail generated again. Requires administering the course."
    };
  }

  rpc deleteLectureSection(DeleteLectureSectionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/courses/{course_id}/streams/{stream_id}/sections/{section_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Delete one of a lecture's chapters."
      description: "Deletes the section and asks a worker to delete its thumbnail. Requires administering the course."
    };
  }

  rpc deleteLectureAttachment(DeleteLectureAttachmentRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/courses/{course_id}/streams/{stream_id}/attachments/{file_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Delete one of a lecture's attachments."
      description: "Deletes the attachment and its file on disk. The file must be one of the lecture's attachments; recordings and thumbnails answer 404. Requires administering the course."
    };
  }

  rpc deleteLectureThumbnail(DeleteLectureThumbnailRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/courses/{course_id}/streams/{stream_id}/thumbnail"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Delete a lecture's custom thumbnail."
      description: "Deletes the uploaded thumbnail and its file, so the generated ones show again. Answers 404 when there is none. Requires administering the course."
    };
  }

  rpc requestLectureSubtitles(RequestLectureSubtitlesRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/courses/{course_id}/streams/{stream_id}/subtitles"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Have subtitles generated for a lecture."
      description: "Hands the lecture's recording to the voice service, which sends the subtitles back when done. Answers 400 for a lecture with no recording and 503 when no voice service is configured. Requires administering the course."
    };
  }

  rpc getLectureTranscodingProgress(GetLectureTranscodingProgressRequest) returns (GetLectureTranscodingProgressResponse) {
    option (google.api.http) = {get: "/courses/{course_id}/streams/{stream_id}/transcoding-progress"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Courses"
      summary: "Get how far a lecture's transcoding is."
      description: "The versions still transcoding, with their progress; a version that has finished is no longer listed. For polling while a lecture is converting. Requires administering the course."
    };
  }
}

// Individual streams and everything scoped to one: sections, subtitles,
// thumbnails, watch progress and bookmarks.
service StreamService {
  rpc getStream(GetStreamRequest) returns (CourseStream) {
    option (google.api.http) = {get: "/streams/{slug}/{stream_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Streams"
      summary: "Get stream and course by course slug and stream ID."
      description: "Retrieves a stream and its course by its stream ID."
    };
  }

  rpc getVideoSections(GetVideoSectionsRequest) returns (GetVideoSectionsResponse) {
    option (google.api.http) = {get: "/streams/{slug}/{stream_id}/sections"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Streams"
      summary: "Get video sections by course slug and stream ID."
      description: "Retrieves the video sections for a stream."
    };
  }

  rpc getStreamPlaylist(GetStreamPlaylistRequest) returns (GetStreamPlaylistResponse) {
    option (google.api.http) = {get: "/streams/{slug}/{stream_id}/playlist"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Streams"
      summary: "Get stream playlist by course slug and stream ID."
      description: "Retrieves the playlist for a stream including watch progress."
    };
  }

  rpc getSubtitles(GetSubtitlesRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/streams/{slug}/{stream_id}/subtitles/{lang}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Streams"
      summary: "Get subtitles by course slug, stream ID, and language."
      description: "Retrieves the subtitles for a stream in a specific language."
    };
  }

  rpc getThumbs(GetThumbsRequest) returns (google.api.HttpBody) {
    option (google.api.http) = {get: "/streams/{slug}/{stream_id}/thumbs"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Streams"
      summary: "Get thumbs by course slug, stream ID, and optional thumb type."
      description: "Retrieves the thumbs for a stream."
    };
  }

  rpc getProgressBatch(GetProgressBatchRequest) returns (GetProgressBatchResponse) {
    option (google.api.http) = {get: "/progress"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Progress"
      summary: "Get watch progress for a batch of streams."
      description: "Retrieves all watch progresses for the current user."
    };
  }

  rpc updateProgress(UpdateProgressRequest) returns (StreamProgress) {
    option (google.api.http) = {
      patch: "/progress/{stream_id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Progress"
      summary: "Update watch progress for stream."
      description: "Updates the watch progress of a stream for the current user."
    };
  }

  rpc addBookmark(AddBookmarkRequest) returns (AddBookmarkResponse) {
    option (google.api.http) = {post: "/bookmarks"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Bookmarks"
      summary: "Add a bookmark."
      description: "Adds a new bookmark."
    };
  }

  rpc getBookmarks(GetBookmarksRequest) returns (GetBookmarksResponse) {
    option (google.api.http) = {get: "/bookmarks"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Bookmarks"
      summary: "Get bookmarks by stream ID."
      description: "Retrieves bookmarks by stream ID."
    };
  }

  rpc updateBookmark(UpdateBookmarkRequest) returns (UpdateBookmarkResponse) {
    option (google.api.http) = {put: "/bookmarks/{bookmark_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Bookmarks"
      summary: "Update a bookmark."
      description: "Updates an existing bookmark."
    };
  }

  rpc deleteBookmark(DeleteBookmarkRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/bookmarks/{bookmark_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Bookmarks"
      summary: "Delete a bookmark."
      description: "Deletes a bookmark."
    };
  }

  // Points the camera of a live stream's lecture hall at one of its presets. Reaches
  // the physical camera, so it answers the way (*API).cameraFor documents on top of
  // the usual permission failures.
  rpc switchCameraPreset(SwitchCameraPresetRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {post: "/courses/{course_id}/streams/{stream_id}/presets/{preset_id}/switch"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Streams"
      summary: "Switch a live stream's camera to a preset."
      description: "Moves the camera of the stream's lecture hall to the preset and returns once it has had time to arrive. The stream must be live and the preset must belong to its lecture hall. Requires administering the course."
    };
  }
}

// Server administration: everything belonging to no particular course.
//
// One service rather than one per resource, because runner/*.proto shares this proto
// package and is linked into the same binary — `RunnerService` is already taken there,
// and a collision only shows up as a panic at boot.
//
// It groups endpoints, not permissions: policies are per method in services.go, and
// the account pages need PermManageUsers rather than PermAdministerServer.
service AdminService {
  rpc listRunners(google.protobuf.Empty) returns (ListRunnersResponse) {
    option (google.api.http) = {get: "/admin/runners"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Runners"
      summary: "List the transcoding runners."
      description: "Retrieves every registered runner with its current liveness and workload. Requires the server.administer permission."
    };
  }

  rpc deleteRunner(DeleteRunnerRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/runners/{hostname}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Runners"
      summary: "Delete a runner."
      description: "Removes a runner registration. A runner that is still running re-registers on its next heartbeat. Requires the server.administer permission."
    };
  }

  // Two RPCs rather than one with a filter: searchUsers reaches every account and
  // masks contact details, listStaff reaches only staff and does not.
  rpc listStaff(google.protobuf.Empty) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/admin/users"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Users"
      summary: "List the administrators and lecturers."
      description: "Retrieves every account holding a staff role, with contact details unmasked. Requires the users.manage permission."
    };
  }

  rpc searchUsers(SearchUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {get: "/admin/users/search"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Users"
      summary: "Search accounts."
      description: "Searches every account by name, email or login. Contact details come back masked. The query must be at least three characters unless a role is given. Requires the users.manage permission."
    };
  }

  rpc createUser(CreateUserRequest) returns (UserSummary) {
    option (google.api.http) = {
      post: "/admin/users"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Users"
      summary: "Create a lecturer account."
      description: "Creates an account with the lecturer role and emails an invitation to set a password. Requires the users.manage permission."
    };
  }

  rpc updateUserRole(UpdateUserRoleRequest) returns (UserSummary) {
    option (google.api.http) = {
      patch: "/admin/users/{user_id}/role"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Users"
      summary: "Change an account's role."
      description: "Sets the role of an account. Requires the users.manage permission."
    };
  }

  rpc deleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/users/{user_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Users"
      summary: "Delete an account."
      description: "Deletes an account. Administrators cannot be deleted. Requires the users.manage permission."
    };
  }

  rpc listServerNotificationsAdmin(google.protobuf.Empty) returns (ListServerNotificationsAdminResponse) {
    option (google.api.http) = {get: "/admin/server-notifications"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Notifications"
      summary: "List every server notification for administration."
      description: "Retrieves every server notification, past, active and future, with its id. Requires the server.administer permission."
    };
  }

  rpc createServerNotification(CreateServerNotificationRequest) returns (ServerNotificationAdmin) {
    option (google.api.http) = {
      post: "/admin/server-notifications"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Notifications"
      summary: "Create a server notification."
      description: "Creates a banner shown site-wide between start and expires. Requires the server.administer permission."
    };
  }

  rpc updateServerNotification(UpdateServerNotificationRequest) returns (ServerNotificationAdmin) {
    option (google.api.http) = {
      patch: "/admin/server-notifications/{id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Notifications"
      summary: "Update a server notification."
      description: "Replaces a server notification's text, severity and active window. Requires the server.administer permission."
    };
  }

  rpc deleteServerNotification(DeleteServerNotificationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/server-notifications/{id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Notifications"
      summary: "Delete a server notification."
      description: "Deletes a server notification; it stops showing immediately. Requires the server.administer permission."
    };
  }

  rpc listInfoPagesAdmin(google.protobuf.Empty) returns (ListInfoPagesAdminResponse) {
    option (google.api.http) = {get: "/admin/info-pages"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Info Pages"
      summary: "List every info page for administration."
      description: "Retrieves every info page with its raw content, for editing. Requires the server.administer permission."
    };
  }

  rpc createInfoPage(CreateInfoPageRequest) returns (InfoPage) {
    option (google.api.http) = {
      post: "/admin/info-pages"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Info Pages"
      summary: "Create an info page."
      description: "Creates a page reachable at /{slug} once created, without a redeploy. The slug must be unique. Requires the server.administer permission."
    };
  }

  rpc updateInfoPage(UpdateInfoPageRequest) returns (InfoPage) {
    option (google.api.http) = {
      patch: "/admin/info-pages/{id}"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Info Pages"
      summary: "Update an info page."
      description: "Replaces an info page's slug, title and content. Requires the server.administer permission."
    };
  }

  rpc deleteInfoPage(DeleteInfoPageRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/info-pages/{id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Info Pages"
      summary: "Delete an info page."
      description: "Deletes an info page; its route stops resolving immediately. Requires the server.administer permission."
    };
  }

  rpc listIntegrations(google.protobuf.Empty) returns (ListIntegrationsResponse) {
    option (google.api.http) = {get: "/admin/integrations"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Integrations"
      summary: "List registered integrations."
      description: "Returns application details and key status, never API keys. Requires the server.administer permission."
    };
  }

  rpc createIntegration(CreateIntegrationRequest) returns (CreateIntegrationResponse) {
    option (google.api.http) = {
      post: "/admin/integrations"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Integrations"
      summary: "Register an integration."
      description: "Registers an application with its return URL and returns a new API key. Requires the server.administer permission."
    };
  }

  rpc rotateIntegrationKey(RotateIntegrationKeyRequest) returns (RotateIntegrationKeyResponse) {
    option (google.api.http) = {post: "/admin/integrations/{id}/key"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Integrations"
      summary: "Replace an integration API key."
      description: "Returns a new key and invalidates the old one. Requires the server.administer permission."
    };
  }

  rpc revokeIntegrationKey(RevokeIntegrationKeyRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/integrations/{id}/key"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Integrations"
      summary: "Revoke an integration API key."
      description: "Invalidates the key without deleting the application. Requires the server.administer permission."
    };
  }

  rpc listWorkers(google.protobuf.Empty) returns (ListWorkersResponse) {
    option (google.api.http) = {get: "/admin/workers"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Workers"
      summary: "List the encoding workers."
      description: "Retrieves every registered worker with its current liveness, workload and VM stats, plus the token new workers authenticate with. Requires the server.administer permission."
    };
  }

  rpc deleteWorker(DeleteWorkerRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/workers/{worker_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Workers"
      summary: "Delete a worker."
      description: "Removes a worker registration. A worker that is still running re-registers on its next heartbeat. Requires the server.administer permission."
    };
  }

  // Thumbnail regeneration runs in a goroutine and outlives the request that started
  // it, so the page polls getMaintenanceThumbnailStatus the way the old page polled
  // its own status endpoint every five seconds.
  rpc getMaintenanceThumbnailStatus(google.protobuf.Empty) returns (MaintenanceThumbnailStatus) {
    option (google.api.http) = {get: "/admin/maintenance/thumbnails/status"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Maintenance"
      summary: "Get the thumbnail regeneration progress."
      description: "Reports whether a thumbnail regeneration run is in progress and how far it has gotten. Requires the server.administer permission."
    };
  }

  rpc generateMaintenanceThumbnails(google.protobuf.Empty) returns (MaintenanceThumbnailStatus) {
    option (google.api.http) = {post: "/admin/maintenance/thumbnails/generate"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Maintenance"
      summary: "Regenerate every VoD thumbnail."
      description: "Starts a background job that requests a fresh thumbnail for every VoD file. A run already in progress is left alone rather than started twice. Requires the server.administer permission."
    };
  }

  rpc listMaintenanceCronJobs(google.protobuf.Empty) returns (ListMaintenanceCronJobsResponse) {
    option (google.api.http) = {get: "/admin/maintenance/cron"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Maintenance"
      summary: "List the jobs the scheduler knows by name."
      description: "Retrieves the names of every registered cron job, for triggering one manually. Requires the server.administer permission."
    };
  }

  rpc runMaintenanceCronJob(RunMaintenanceCronJobRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/maintenance/cron/run"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Maintenance"
      summary: "Run a cron job now."
      description: "Executes a registered job immediately, without waiting for its schedule. Requires the server.administer permission."
    };
  }

  rpc listMaintenanceTranscodingFailures(google.protobuf.Empty) returns (ListMaintenanceTranscodingFailuresResponse) {
    option (google.api.http) = {get: "/admin/maintenance/transcoding-failures"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Maintenance"
      summary: "List transcoding failures."
      description: "Retrieves every recorded transcoding failure, worker and log included. Requires the server.administer permission."
    };
  }

  rpc deleteMaintenanceTranscodingFailure(DeleteMaintenanceTranscodingFailureRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/maintenance/transcoding-failures/{id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Maintenance"
      summary: "Dismiss a transcoding failure."
      description: "Deletes a recorded transcoding failure. It does not retry the transcode. Requires the server.administer permission."
    };
  }

  rpc listMaintenanceEmailFailures(google.protobuf.Empty) returns (ListMaintenanceEmailFailuresResponse) {
    option (google.api.http) = {get: "/admin/maintenance/email-failures"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Maintenance"
      summary: "List failed emails."
      description: "Retrieves every email that has exhausted its retries or is still failing, with its body and error history. Requires the server.administer permission."
    };
  }

  rpc deleteMaintenanceEmailFailure(DeleteMaintenanceEmailFailureRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/maintenance/email-failures/{id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Maintenance"
      summary: "Dismiss a failed email."
      description: "Deletes a failed email; it is not retried afterwards. Requires the server.administer permission."
    };
  }

  // Course import reaches TUMonline directly (rather than a dao) and belongs to no
  // course yet, so it is server-wide like runners and info pages.
  rpc searchCourseImportSchedule(CourseImportSearchRequest) returns (CourseImportSearchResponse) {
    option (google.api.http) = {
      post: "/admin/course-import/search"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Import"
      summary: "Search the TUMonline room schedule for courses."
      description: "Fetches the department's room schedule from TUMonline for the given date range, groups it by course and enriches each with its contacts and language. Requires the server.administer permission."
    };
  }

  rpc importCourseImportCourses(CourseImportRequest) returns (CourseImportResponse) {
    option (google.api.http) = {
      post: "/admin/course-import"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Course Import"
      summary: "Import the selected courses."
      description: "Creates a course and its streams for each selected course, then emails its main contact an activation (or opt-out) link. A failure importing one course does not stop the others; the response reports each outcome. Requires the server.administer permission."
    };
  }

  // Tokens are gated on users.manage, same as the account pages, rather than
  // server.administer: this is the only place they can be issued or revoked at all.
  rpc listTokens(google.protobuf.Empty) returns (ListTokensResponse) {
    option (google.api.http) = {get: "/admin/tokens"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Tokens"
      summary: "List API tokens."
      description: "Retrieves every issued token's owner, scope and usage -- never the secret itself, which is shown only once, at creation. Requires the users.manage permission."
    };
  }

  rpc createToken(CreateTokenRequest) returns (TokenSecret) {
    option (google.api.http) = {
      post: "/admin/tokens"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Tokens"
      summary: "Create an API token."
      description: "Creates a token for self-streaming or admin API access and returns its secret. The secret is returned only in this response and cannot be retrieved again. Requires the users.manage permission."
    };
  }

  rpc deleteToken(DeleteTokenRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/tokens/{id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Tokens"
      summary: "Revoke an API token."
      description: "Deletes a token; it stops authenticating immediately. Requires the users.manage permission."
    };
  }

