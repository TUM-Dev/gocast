    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Notifications"
      summary: "Broadcast a notification."
      description: "Creates a notification shown to users matching its target group. Requires the server.administer permission."
    };
  }

  rpc deleteNotification(DeleteNotificationRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/admin/notifications/{id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      tags: "Notifications"
