  int32 vod_views = 6;
  // The most viewers the lecture had at once while it was live.
  int32 max_live_views = 7;
  // Concurrent viewers through the live lecture, by time of day.
  ServerStatsSeries live_viewers = 8;
  // VoD views by day of week.
  ServerStatsSeries weekdays = 9;
  // VoD views by calendar day.
  ServerStatsSeries all_days = 10;
  // Set for lectures from 2021 or earlier, which can predate the viewing data
  // (collected from 28 June 2021), so their numbers undercount.
  bool partial_history = 11;
}

// ----- Lecture administration -----

message ListCourseLecturesAdminRequest {
  uint32 course_id = 1;
}

message ListCourseLecturesAdminResponse {
  // Newest first.
  repeated CourseLectureAdmin lectures = 1;
}

// CourseLectureAdmin is a lecture as its course's administrators manage it. Unlike
// Stream, it carries the stream key and no signed playlist URLs.
message CourseLectureAdmin {
  uint32 id = 1;
  uint32 course_id = 2;
  string name = 3;
  string description = 4;
  google.protobuf.Timestamp start = 5;
  google.protobuf.Timestamp end = 6;
  // 0 and empty for a lecture in no hall (self-streamed).
  uint32 lecture_hall_id = 7;
  string lecture_hall_name = 8;
  // Shared by the lectures created together as a series; empty for a lone lecture.
  string series_identifier = 9;
  // The secret a self-streaming lecturer puts in the ingest URL.
  string stream_key = 10;
  bool chat_enabled = 11;
  bool private = 12;
  bool custom_thumbnail_enabled = 13;
  bool live_now = 14;
  // Has a recording (a VoD).
  bool recording = 15;
  // Ended and not yet recorded.
  bool past = 16;
  // A version is still transcoding.
  bool converting = 17;
  bool premiere = 18;
  // The recorded versions there are: any of COMB, PRES and CAM.
  repeated string vod_versions = 19;
  // The recording's length in seconds, 0 when not known.
  uint32 duration_seconds = 20;
  repeated LectureFileAdmin files = 21;
  repeated LectureTranscodingProgress transcoding_progresses = 22;
  repeated LectureVideoSectionAdmin video_sections = 23;
}

message LectureFileAdmin {
  uint32 id = 1;
  // model.FileType: 2 = attachment, the thumbnail kinds above that.
  uint32 type = 2;
  string friendly_name = 3;
}

message LectureTranscodingProgress {
  // COMB, PRES or CAM.
  string version = 1;
  // Percent.
  int32 progress = 2;
}

message LectureVideoSectionAdmin {
  uint32 id = 1;
  string description = 2;
  uint32 start_hours = 3;
  uint32 start_minutes = 4;
  uint32 start_seconds = 5;
  uint32 file_id = 6;
}

message UpdateLectureSeriesRequest {
  uint32 course_id = 1;
  // Any lecture of the series; must be one of the course's.
  uint32 stream_id = 2;
  optional string name = 3;
  optional string description = 4;
  // 0 moves the series out of any hall. Server administrators only.
  optional uint32 lecture_hall_id = 5;
  optional bool chat_enabled = 6;
}

message UpdateLectureSeriesTimeRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  // The lecture's own new times; the rest of the series takes their time of day
  // and duration. End must be after start.
  google.protobuf.Timestamp start = 3;
  google.protobuf.Timestamp end = 4;
}

message UpdateLecturesLectureHallRequest {
  uint32 course_id = 1;
  repeated uint32 stream_ids = 2;
  // 0 moves the lectures out of any hall (self-streamed).
  uint32 lecture_hall_id = 3;
}

message DeleteLecturesRequest {
  uint32 course_id = 1;
  repeated uint32 stream_ids = 2;
}

message DeleteLectureSeriesRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
}

message CopyLectureRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  // Must also be administered by the caller.
  uint32 target_course_id = 3;
  // Deletes the original once the copy exists.
  bool move = 4;
}

message CopyLectureResponse {
  // The copy's ID, a new one even on a move.
  uint32 stream_id = 1;
}

// What a created lecture is. LIVESTREAM, the zero value, is v1's default.
enum LectureCreationKind {
  // Streamed live: from its lecture hall, or by the lecturer with its stream key.
  LECTURE_CREATION_KIND_LIVESTREAM = 0;
  // A recording uploaded afterwards through POST .../streams/{stream_id}/media.
  LECTURE_CREATION_KIND_VOD_UPLOAD = 1;
  // A recording a worker streams as if live, starting at the lecture's start.
  LECTURE_CREATION_KIND_PREMIERE = 2;
}

message CreateLecturesRequest {
  uint32 course_id = 1;
  // Required; every lecture created gets it.
  string title = 2;
  LectureCreationKind kind = 3;
  // The first lecture's start. Required unless ad_hoc.
  google.protobuf.Timestamp start = 4;
  // How long each lecture runs. Required for a livestream; a VOD_UPLOAD or
  // PREMIERE given 0 gets an hour.
  uint32 duration_minutes = 5;
  // 0 for none: a self-streamed livestream, and always for the other kinds.
  uint32 lecture_hall_id = 6;
  bool chat_enabled = 7;
  // A livestream starting now (two minutes from now, for a worker to pick it up).
  bool ad_hoc = 8;
  // Further lectures besides the one at start, as v1's dateSeries: the client
  // computes the weekly or daily dates. Empty for a single lecture.
  repeated google.protobuf.Timestamp date_series = 9;
}

message CreateLecturesResponse {
  // The one at start first, then one per date_series entry in the order given.
  repeated CourseLectureAdmin lectures = 1;
}

// ----- Lecture administration, part 2 -----

message LectureSectionInput {
  string description = 1;
  uint32 start_hours = 2;
  // Below 60.
  uint32 start_minutes = 3;
  // Below 60.
  uint32 start_seconds = 4;
}

message CreateLectureSectionsRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  // At least one.
  repeated LectureSectionInput sections = 3;
}

message CreateLectureSectionsResponse {
  // All of the lecture's sections, the new ones included, in order of their start.
  repeated LectureVideoSectionAdmin sections = 1;
}

message UpdateLectureSectionRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  uint32 section_id = 3;
  string description = 4;
  uint32 start_hours = 5;
  uint32 start_minutes = 6;
  uint32 start_seconds = 7;
}

message DeleteLectureSectionRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  uint32 section_id = 3;
}

message DeleteLectureAttachmentRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  uint32 file_id = 3;
}

message DeleteLectureThumbnailRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
}

message RequestLectureSubtitlesRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  // The spoken language, as an ISO 639 code: "de" or "en" on the old page.
  string language = 3;
}

message GetLectureTranscodingProgressRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
}

message GetLectureTranscodingProgressResponse {
  // Empty once every version has finished.
  repeated LectureTranscodingProgress progresses = 1;
}

// ----- end of lecture administration -----

///////////////////////////////
///// LECTURE_HALL_ADMIN //////
///////////////////////////////

// LectureHallAdmin is a lecture hall as an administrator configures it: the stream
// sources the worker/runner pulls from plus the optional hardware addresses. Distinct
// from LectureHall (LECTURE_HALL_MESSAGE above), which is the trimmed shape shown to
// viewers.
message LectureHallAdmin {
  uint32 id = 1;
  // As the hall is named in SMP, e.g. room_00_13_009A -- not a free-form label.
  string name = 2;
  // 1 = rtsp, 2 = srt; mirrors model.StreamProtocol.
  uint32 stream_protocol = 3;
  string comb_ip = 4;
  string pres_ip = 5;
  string cam_ip = 6;
  // IP of the physical Axis camera itself (not the SMP address above). Empty for
  // halls with no camera, e.g. VMP backed ones.
  string camera_ip = 7;
  // Drives the red live light through an Anel PWR-Ctrl. Empty when there is none.
  string pwr_ctrl_ip = 8;
  // Empty until refreshLectureHallPresetsAdmin has fetched them at least once. Only
  // ever populated for a hall with camera_ip set.
  repeated CameraPresetAdmin camera_presets = 9;
}

// CameraPresetAdmin is a camera preset as an administrator manages it: named
// "*Admin" for the same reason as LectureHallAdmin -- CameraPreset above is the
// trimmed, viewer-facing shape.
message CameraPresetAdmin {
  uint32 lecture_hall_id = 1;
  // The camera's own numbering, not a database id -- this is what SetPreset on the
  // camera takes.
  uint32 preset_id = 2;
  string name = 3;
  // Filename under the static directory, empty until a snapshot has been taken.
  // Rendered as /public/{image}.
  string image = 4;
  bool is_default = 5;
}

message ListLectureHallsAdminResponse {
  repeated LectureHallAdmin lecture_halls = 1;
}

message CreateLectureHallAdminRequest {
  string name = 1;
  uint32 stream_protocol = 2;
  string comb_ip = 3;
  string pres_ip = 4;
  string cam_ip = 5;
  string camera_ip = 6;
  string pwr_ctrl_ip = 7;
}

message UpdateLectureHallAdminRequest {
  uint32 id = 1;
  string name = 2;
  uint32 stream_protocol = 3;
  string comb_ip = 4;
  string pres_ip = 5;
  string cam_ip = 6;
  string camera_ip = 7;
  string pwr_ctrl_ip = 8;
}

message DeleteLectureHallAdminRequest {
  uint32 id = 1;
}

message RefreshLectureHallPresetsAdminRequest {
  uint32 id = 1;
}

message SetDefaultCameraPresetAdminRequest {
  uint32 lecture_hall_id = 1;
  uint32 preset_id = 2;
}

message TakeCameraPresetSnapshotAdminRequest {
  uint32 lecture_hall_id = 1;
  uint32 preset_id = 2;
}

// The hall is not part of the request: it is the stream's, so a course's
// administrators cannot reach the camera of a room their stream is not in.
message SwitchCameraPresetRequest {
  uint32 course_id = 1;
  uint32 stream_id = 2;
  uint32 preset_id = 3;
}

///////////////////////////////
//// SEARCH, TOKENS, ONBOARDING
///////////////////////////////

message SearchRequest {
  string query = 1;
  // Per kind of hit; 10 by default, 100 at most.
  uint32 limit = 2;
  // Semesters written like 2022S. Wins over the range below.
  repeated string semesters = 3;
  string first_semester = 4;
  string last_semester = 5;
  // Courses written like brauereiwesen2022S, at most three.
  repeated string courses = 6;
  // Find courses only, never lectures, as the start page's search box does.
  bool courses_only = 7;
}

message SearchCourseHit {
  string name = 1;
  string slug = 2;
  uint32 year = 3;
  string term = 4;
}

message SearchStreamHit {
  uint32 id = 1;
  string name = 2;
  string description = 3;
  string course_name = 4;
  string course_slug = 5;
  uint32 year = 6;
  string term = 7;
}

message SearchSubtitleHit {
  uint32 stream_id = 1;
  // Milliseconds into the recording.
  int64 timestamp = 2;
  string text_prev = 3;
  string text = 4;
  string text_next = 5;
  string stream_name = 6;
  google.protobuf.Timestamp stream_start = 7;
  google.protobuf.Timestamp stream_end = 8;
  string course_name = 9;
  string course_slug = 10;
  uint32 year = 11;
  string term = 12;
}

message SearchResponse {
  repeated SearchCourseHit courses = 1;
  repeated SearchStreamHit streams = 2;
  repeated SearchSubtitleHit subtitles = 3;
}

message CourseTokenRequest {
  string token = 1;
}

message CourseByToken {
  uint32 id = 1;
  string name = 2;
  string slug = 3;
  uint32 year = 4;
  string term = 5;
  // Opted out earlier: the course is soft-deleted and opting in restores it.
  bool opted_out = 6;
}

message PasswordResetKeyRequest {
  string key = 1;
}

message SetPasswordByResetKeyRequest {
  string key = 1;
  string password = 2;
}

message CreateFirstUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message GetIntegrationResponse {
  uint32 id = 1;
  string name = 2;
  string return_url = 3;
}

message ListCourseIntegrationGrantsRequest {
  uint32 course_id = 1;
}

message CourseIntegrationGrant {
  uint32 id = 1;
  string name = 2;
}

message ListCourseIntegrationGrantsResponse {
  repeated CourseIntegrationGrant grants = 1;
}

message RevokeCourseIntegrationGrantRequest {
  uint32 course_id = 1;
  uint32 grant_id = 2;
}
