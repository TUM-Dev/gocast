
###############################################
# General parameters

# Sets the verbosity of the program; available values are "error", "warn", "info", "debug".
logLevel: debug
# Destinations of log messages; available values are "stdout", "file" and "syslog".
logDestinations: [stdout]

# Timeout of read operations.
readTimeout: 10s
# Timeout of write operations.
writeTimeout: 10s
# Size of the queue of outgoing packets.
# A higher value allows to increase throughput, a lower value allows to save RAM.
writeQueueSize: 512
# Maximum size of payload of outgoing UDP packets.
# This can be decreased to avoid fragmentation on networks with a low UDP MTU.
udpMaxPayloadSize: 1472

###############################################
# Authentication parameters

# Authentication method; available values are "internal", "http" and "jwt".
authMethod: http
# HTTP URL called to perform authentication.
# Every time a user wants to perform an action, the server calls this URL
# with the POST method and a body containing:
# {
#   "ip": "ip",
#   "user": "user",
#   "password": "password",
#   "path": "path",
#   "protocol": "rtsp|rtmp|hls|webrtc",
#   "id": "id",
#   "action": "publish|read|playback|api|metrics|pprof",
#   "query": "query"
# }
# If the response code is 20x, the action is allowed, otherwise it is forbidden.
# GoCast answers this on /api/selfstream/onPublish: it validates the stream key
# and slug carried in the query for "publish", and allows every other action.
# Uncomment the other line for local use
authHTTPAddress: https://tum.live/api/selfstream/onPublish
#authHTTPAddress: http://localhost:8081/api/selfstream/onPublish

###############################################
# API and metrics

# Enable the control API server.
api: false
# Address of the API listener.
apiAddress: 127.0.0.1:9997

# Enable Prometheus-compatible metrics.
metrics: false
# Address of the metrics listener.
metricsAddress: 127.0.0.1:9998

###############################################
# Server protocols

# Only RTMP ingest is used; everything else stays off. srt and moq are
# newer protocols that default to enabled, so they have to be named
# explicitly or they open listeners nothing here uses.
rtsp: false
srt: false
moq: false

rtmp: true
# Address of the RTMP listener.
rtmpAddress: :1935
# Use the secure protocol variant (RTMPS).
rtmpEncryption: "no"

hls: false

webrtc: false

###############################################
# Path settings

paths:
  # Settings under path "all_others" are applied to all paths that
  # do not match another entry.
  all_others:
    source: publisher
