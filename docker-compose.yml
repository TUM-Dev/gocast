#    image: ghcr.io/tum-dev/tum-live-voice-service:latest
#    environment:
#      - TRANSCRIBER=whisper
#      - WHISPER_MODEL=tiny
#      - MAX_WORKERS=10
#      - DEBUG=1
#    volumes:
#      - mass:/mass

volumes:
  frontend_dev_node_modules:
  frontend_dev_pnpm_store:
  vod:
  mariadb-data:
  runner_data:
  meili_gocast_data:
  prometheus-data: