####################################################
# Not production ready, only for local development #
####################################################

services:
  tum-live:
    container_name: tum-live
    depends_on:
      db:
        condition: service_healthy
      meili-internal:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile-local
    volumes:
      - ./config.yaml:/etc/TUM-Live/config.yaml
      - ./branding/branding.yaml:/etc/TUM-Live/branding.yaml
    restart: always
    environment:
      - DBHOST=db
      - MEILIHOST=http://meili-internal:7700
      - TZ=Europe/Berlin
    ports:
      - "8081:8081"
    # extra_hosts:       # Only needed if you use wsl
    #   - "localhost:host-gateway"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 8081 || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 60s
    develop:
      # The Go source, templates and frontend all end up compiled or embedded into
      # one binary (see web/router.go's //go:embed directives), so there's no
      # process to hot-reload into - `rebuild` re-runs the (now BuildKit-cached)
      # Docker build and recreates the container. `docker compose watch` (or
      # `up --watch`) picks this up.
      watch:
        - action: rebuild
          path: ./go.mod
        - action: rebuild
          path: ./go.sum
        - action: rebuild
          path: ./cmd
        - action: rebuild
          path: ./api
        - action: rebuild
          path: ./apiv2
        - action: rebuild
          path: ./dao
        - action: rebuild
          path: ./mock_dao
        - action: rebuild
          path: ./mock_tools
        - action: rebuild
          path: ./model
        - action: rebuild
          path: ./pkg
        - action: rebuild
          path: ./tools
        - action: rebuild
          path: ./web
          ignore:
            - web/node_modules
            - web/assets/ts-dist
            - web/assets/css-dist
            - web/assets/vendor
            - web/spa/assets
            - web/spa/index.html
        - action: rebuild
          path: ./frontend
          ignore:
            - frontend/node_modules
        - action: sync+restart
          path: ./config.yaml
          target: /etc/TUM-Live/config.yaml
        - action: sync+restart
          path: ./branding/branding.yaml
          target: /etc/TUM-Live/branding.yaml
  runner:
    container_name: tum-live-runner
    depends_on:
      tum-live:
        condition: service_healthy
    build:
      context: runner/
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      - STORAGE_PATH=/storage/mass
      - SEGMENT_PATH=/storage/live
      - REALHOST=runner
      - "EDGE_SERVER=http://localhost:8089"
      - "GOCAST_SERVER=tum-live:50056"
    volumes:
      - runner_data:/storage/live
      - vod:/storage/mass
    ports:
      - "52735:52735"
      - "9947:9947"
  ingest:
    container_name: tum-live-ingest
    build:
      context: ingest/
      dockerfile: Dockerfile-local
    platform: linux/amd64
    ports:
      - "1935:1935"
    networks:
      default:
        # The stock config's ingestbase, so the runner pulls self-streams from this container.
        aliases: [ ingest.tum.live ]
  edge:
    container_name: tum-live-edge
    depends_on:
      tum-live:
        condition: service_healthy
    build: worker/edge
    environment:
      - VOD_DIR=/vod
      - MAIN_INSTANCE=http://tum-live:8081
      - ADMIN_TOKEN=123
    ports:
      - "8089:8089"
      - "2112:2112"
    volumes:
      - vod:/vod
  db:
    container_name: mariadb_container
    image: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: example
      TZ: Europe/Berlin
    volumes:
      # Loaded once into an empty volume; --init-file reran the dump, which drops its
      # tables, on every restart. Reset the data with `docker compose down -v`.
      - ./tum-live-starter.sql:/docker-entrypoint-initdb.d/tum-live-starter.sql:ro
      - mariadb-data:/var/lib/mysql
    restart: always
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
  vod-service:
    container_name: tum-live-vod-service
    depends_on:
      runner:
        condition: service_started
    build:
        context: vod-service
        dockerfile: Dockerfile-local
    environment:
      - OUTPUT_DIR=/vod
    volumes:
      - vod:/vod
  meili-internal: 
    image: getmeili/meilisearch:latest
    # KEIN container_name! (Docker generiert einen eindeutigen Namen)
    ports:
      - "7700:7700"     # Extern 7701 nutzen, um Konflikt mit 7700 zu vermeiden
    environment:
      - MEILI_HTTP_ADDR=0.0.0.0:7700
      - MEILI_MASTER_KEY=MASTER_KEY
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_gocast_data:/meili_data # Eigener Volume-Name
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:7700/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
  prometheus:
    container_name: tum-live-prometheus
    image: prom/prometheus
    depends_on:
      runner:
        condition: service_started
      edge:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
  # Vite dev server with hot module replacement for the SPA.
  #   docker compose --profile dev up -d frontend-dev
  frontend-dev:
    container_name: gocast-frontend-dev
    image: node:25
    profiles: [ dev ]
    depends_on:
      tum-live:
        condition: service_healthy
    working_dir: /app/frontend
    environment:
      - COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      # localhost in here is this container, so the proxy needs the service name.
      - GOCAST_BACKEND=http://tum-live:8081
      # WSL2 and bind mounts do not always deliver inotify events; flip this to true
      # if edits are not picked up.
      - CHOKIDAR_USEPOLLING=false
    volumes:
      - ./frontend:/app/frontend
      # Keep the host's node_modules and the container's apart: they are installed for
      # different platforms and the native esbuild/rollup binaries are not compatible.
      - frontend_dev_node_modules:/app/frontend/node_modules
      - frontend_dev_pnpm_store:/pnpm-store
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install -g corepack@latest --force && corepack enable pnpm &&
             pnpm config set store-dir /pnpm-store &&
             pnpm install --frozen-lockfile &&
             pnpm run dev"
  docs:
    container_name: gocast-docs
    image: node:24
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./docs_v2:/app
    command: sh -c "npm install -g corepack@latest --force && corepack enable pnpm && pnpm install --frozen-lockfile && pnpm run start --host 0.0.0.0"
# Omitted for local development due to size. Comment out to use voice-service
#  voice-service:
