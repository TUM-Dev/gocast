edition = "2023";

package protobuf;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "commons.proto";
import "notifications.proto";

option go_package = "runner/protobuf";

service RunnerService {
  // Requests a stream from a lecture hall
  rpc RequestStream (StreamRequest) returns (StreamResponse) {}
  rpc RequestStreamEnd (StreamEndRequest) returns (StreamEndResponse) {}
  // Requests thumbnails for the given video sections of an already recorded stream.
  // The images are delivered asynchronously via SectionImagesReadyNotification.
  rpc RequestSectionImages (SectionImageRequest) returns (SectionImageResponse) {}
  // Regenerates the thumbnail for an already-recorded VOD.
  // The result is delivered asynchronously via ThumbnailReadyNotification.
  rpc RegenerateThumbnail (RegenerateThumbnailRequest) returns (RegenerateThumbnailResponse) {}
  // Reserves a one-time upload slot for a video file of a stream. The file itself is
  // then POSTed to the runner's upload endpoint using the returned token; the runner
  // converts it to a VOD and reports it via VODReadyNotification and
  // ThumbnailReadyNotification.
  rpc PrepareUpload (PrepareUploadRequest) returns (PrepareUploadResponse) {}
  // Grabs a preview frame from the most recent part of a running livestream. Unlike the
  // other thumbnail RPCs this one is synchronous: previews are refreshed every minute and
  // a stale one is simply replaced, so there is no job to track.
  rpc GenerateLivePreview (LivePreviewRequest) returns (LivePreviewResponse) {}
  // Packages a VOD for offline viewing: the segments are copied, not re-encoded, and
  // encrypted with the given key. The result is delivered asynchronously via
  // OfflinePackageReadyNotification or OfflinePackageFailedNotification.
  rpc RequestOfflinePackage (OfflinePackageRequest) returns (OfflinePackageResponse) {}
  // Deletes an offline package once the device has downloaded it. Synchronous: it is
  // one directory removal.
  rpc DeleteOfflinePackage (DeleteOfflinePackageRequest) returns (DeleteOfflinePackageResponse) {}
}

message OfflinePackageRequest {
  // package_id names the package's directory, offline/<package_id> in the storage path.
  uint64 package_id = 1;
  uint64 stream_id = 2;
  StreamVersion version = 3;
  // key is the 16 byte AES-128 key the segments are encrypted with. It is never written
  // anywhere but a temporary file ffmpeg reads, which is removed afterwards.
  bytes key = 4;
  // key_uri is written into the playlist's EXT-X-KEY line. Players never fetch it: the
  // device holds the key already.
  string key_uri = 5;
}

message OfflinePackageResponse {
  string job_id = 1;
}

message DeleteOfflinePackageRequest {
  uint64 package_id = 1;
}

message DeleteOfflinePackageResponse {
}

message StreamRequest {
  uint64 stream_id = 1;
  StreamVersion version = 2;
  google.protobuf.Timestamp end = 3;
  string ffmpeg_global_options = 4; // optional e.g. -rtsp_transport tcp
  string ffmpeg_input_options = 5; // optional
  string ffmpeg_output_options = 6; // e.g. -c:a copy -c:v copy
  string input = 7; // e.g. rtsp://user:password@host:port/rtsp_path
  // The input is published by a lecturer (RTMP ingest), who decides when the stream is over,
  // not the schedule.
  bool self_stream = 8;
  // Scan the finished VoD for silences and report them. All versions of a stream share their
  // audio, so the server asks for this on exactly one of them.
  bool detect_silence = 9;
}

message StreamResponse {
  string job_id = 1;
}

message StreamEndRequest {
  string job_id = 1;
  bool discard_vod = 2;
}

message StreamEndResponse {
}

message SectionImageRequest {
  // Section is a video section and the offset into the recording it starts at.
  message Section {
    uint64 id = 1;
    google.protobuf.Duration start = 2;
  }

  uint64 stream_id = 1;
  string playlist_url = 2;
  repeated Section sections = 3;
}

message SectionImageResponse {
  string job_id = 1;
}

message RegenerateThumbnailRequest {
  uint64 stream_id = 1;
  StreamVersion version = 2;
  string playlist_url = 3;
  // Also scan the VoD for silences, see StreamRequest.detect_silence. The playlist_url is
  // read for that too.
  bool detect_silence = 4;
}

message RegenerateThumbnailResponse {
  string job_id = 1;
}

message PrepareUploadRequest {
  uint64 stream_id = 1;
  StreamVersion version = 2;
  // Scan the imported VoD for silences, see StreamRequest.detect_silence.
  bool detect_silence = 3;
}

message PrepareUploadResponse {
  // token is single use and only valid for a short time.
  string token = 1;
  // upload_port is the port of the runner's HTTP upload endpoint.
  int32 upload_port = 2;
}

message LivePreviewRequest {
  // playlist_url must be signed, as for SectionImageRequest.
  string playlist_url = 1;
}

message LivePreviewResponse {
  // thumbnail is a JPEG.
  bytes thumbnail = 1;
}

// RunnerManagerService service defines communication from runners to gocast
service RunnerManagerService {
  // Register is a request to the server to join the runners pool.
  rpc Register (RegisterRequest) returns (RegisterResponse) {}

  // Notify sends a notification to gocast
  rpc Notify (Notification) returns (NotificationResponse) {}
}

message RegisterRequest {
  string hostname = 1;
  int32 port = 2;
  string version = 3;
}

message RegisterResponse {
}
