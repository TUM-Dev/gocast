edition = "2023";;

package protobuf;
option go_package = "runner/protobuf";

import "commons.proto";

message Notification {
  oneof data {
    StreamStartNotification stream_start = 1;
    StreamEndNotification stream_end = 2;
    HeartbeatNotification heartbeat = 3;
    VODReadyNotification vod_ready = 4;
    ThumbnailReadyNotification thumbnail_ready = 5;
    SectionImagesReadyNotification section_images_ready = 6;
    TranscodingProgressNotification transcoding_progress = 7;
    VODFailedNotification vod_failed = 8;
    SilenceDetectedNotification silence_detected = 9;
    DurationProbedNotification duration_probed = 11;
    SpriteReadyNotification sprite_ready = 12;
    WaveformReadyNotification waveform_ready = 13;
  }
  // W3C traceparent of the runner span that produced this notification, so that the
  // manager's handling of it joins the trace of the job. Empty when tracing is off, and
  // always for heartbeats.
  string trace_parent = 10;
}

message StreamInfo {
  uint64 id = 1;
}

message StreamStartNotification {
  StreamInfo stream = 1;
  string url = 2;
  StreamVersion stream_version = 3;
}

message StreamEndNotification {
  StreamInfo stream = 1;
  StreamVersion stream_version = 2;
}

message HeartbeatNotification {
  string hostname = 1;
  bool draining = 2;
  uint64 job_count = 3;
}

message VODReadyNotification {
  StreamInfo stream = 1;
  StreamVersion stream_version = 2;
  string url = 3;
}

// TranscodingProgressNotification reports how far the conversion of one version of an
// uploaded video has got. It is best effort: a lost one is replaced by the next.
message TranscodingProgressNotification {
  StreamInfo stream = 1;
  StreamVersion stream_version = 2;
  // percent, 0 to 99. A finished conversion is reported by VODReadyNotification.
  int32 progress = 3;
}

// SilenceDetectedNotification reports the stretches of a VoD without sound, in whole seconds.
// starts[i] and ends[i] belong together. Empty lists mean the scan found none, which is not
// the same as no scan: a scan that failed sends nothing.
message SilenceDetectedNotification {
  StreamInfo stream = 1;
  StreamVersion stream_version = 2;
  repeated uint32 starts = 3;
  repeated uint32 ends = 4;
}

// DurationProbedNotification reports the length of a VoD as ffprobe reads it from the
// finished playlist, in whole seconds. It is its own notification, and not a field of
// VODReadyNotification, because redoing the post-processing of a recording has to report
// it too, and VODReady there would run everything that follows a new VoD again.
// Nothing is sent when the probe fails or finds no length.
message DurationProbedNotification {
  StreamInfo stream = 1;
  StreamVersion stream_version = 2;
  uint32 duration_seconds = 3;
}

// WaveformReadyNotification carries the audio levels of a stream for the cut editor.
message WaveformReadyNotification {
  // VersionDuration is the length of one version of the stream.
  message VersionDuration {
    StreamVersion stream_version = 1;
    double seconds = 2;
  }

  StreamInfo stream = 1;
  // One byte per bucket of bucket_seconds, the peak level in it: 0 is -60 dBFS or less, 255
  // is 0 dBFS, linear in between.
  bytes peaks = 2;
  uint32 bucket_seconds = 3;
  // Every version that could be measured. A version that could not be read is missing, which
  // the server must not mistake for one of length 0.
  repeated VersionDuration durations = 4;
}

// VODFailedNotification reports that a VOD could not be made from an uploaded video.
message VODFailedNotification {
  StreamInfo stream = 1;
  StreamVersion stream_version = 2;
  // reason is meant for the person who uploaded the video: it names no paths and
  // none of the runner's internals. Those are in the runner's log.
  string reason = 3;
}

message ThumbnailReadyNotification {
  StreamInfo stream = 1;
  StreamVersion stream_version = 2;
  bytes thumbnail = 3;
}

// SpriteReadyNotification carries the sheet of seekbar preview frames of one version, a JPEG
// of 160x90 frames in 17 columns, one frame every interval_seconds.
message SpriteReadyNotification {
  StreamInfo stream = 1;
  StreamVersion stream_version = 2;
  bytes sprite = 3;
  uint32 interval_seconds = 4;
}

// SectionImage is a single generated video section thumbnail. The image is
// carried as bytes so that gocast, which owns the mass storage directory,
// decides where it is written - the runner never builds a storage path.
message SectionImage {
  uint64 section_id = 1;
  bytes image = 2;
}

message SectionImagesReadyNotification {
  StreamInfo stream = 1;
  repeated SectionImage images = 2;
}

message NotificationResponse {

}
