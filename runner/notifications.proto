edition = "2023";;

package protobuf;
option go_package = "runner/protobuf";

import "commons.proto";

message Notification {
  oneof data {
    StreamStartNotification stream_start = 1;
    StreamEndNotification stream_end = 2;
    HeartbeatNotification heartbeat = 3;
    VODReadyNotification vod_ready = 4;
    ThumbnailReadyNotification thumbnail_ready = 5;
    SectionImagesReadyNotification section_images_ready = 6;
  }
}

message StreamInfo {
  uint64 id = 1;
}

message StreamStartNotification {
  StreamInfo stream = 1;
  string url = 2;
  StreamVersion stream_version = 3;
}

message StreamEndNotification {
  StreamInfo stream = 1;
  StreamVersion stream_version = 2;
}

message HeartbeatNotification {
  string hostname = 1;
  bool draining = 2;
  uint64 job_count = 3;
}

message VODReadyNotification {
  StreamInfo stream = 1;
  StreamVersion stream_version = 2;
  string url = 3;
}

message ThumbnailReadyNotification {
  StreamInfo stream = 1;
  StreamVersion stream_version = 2;
  bytes thumbnail = 3;
}

// SectionImage is a single generated video section thumbnail. The image is
// carried as bytes so that gocast, which owns the mass storage directory,
// decides where it is written - the runner never builds a storage path.
message SectionImage {
  uint64 section_id = 1;
  bytes image = 2;
}

message SectionImagesReadyNotification {
  StreamInfo stream = 1;
  repeated SectionImage images = 2;
}

message NotificationResponse {

}
