edition = "2023";;

package protobuf;
option go_package = "runner/protobuf";

import "commons.proto";

message Notification {
  oneof data {
    StreamStartNotification stream_start = 1;
    StreamEndNotification stream_end = 2;
    HeartbeatNotification heartbeat = 3;
    VODReadyNotification vod_ready = 4;
    ThumbnailReadyNotification thumbnail_ready = 5;
    JobUpdateNotification job_update = 6;
    ActionUpdateNotification action_update = 7;
  }
}

message StreamInfo {
  uint64 id = 1;
}

message StreamStartNotification {
  StreamInfo stream = 1;
  string url = 2;
  StreamVersion stream_version = 3;
}

message StreamEndNotification {
  StreamInfo stream = 1;
}

message HeartbeatNotification {
  string hostname = 1;
  bool draining = 2;
  uint64 job_count = 3;
}

message VODReadyNotification {
  StreamInfo stream = 1;
  StreamVersion stream_version = 2;
  string url = 3;
}

message ThumbnailReadyNotification {
  StreamInfo stream = 1;
  StreamVersion stream_version = 2;
  bytes thumbnail = 3;
}

// WorkState represents the state of a job or action
enum WorkState {
  WORK_STATE_UNSPECIFIED = 0;
  WORK_STATE_CREATED = 1;
  WORK_STATE_RUNNING = 2;
  WORK_STATE_COMPLETED = 3;
  WORK_STATE_FAILED = 4;
  WORK_STATE_CANCELLED = 5;
}

// JobUpdateNotification is sent when a job's status changes
message JobUpdateNotification {
  string job_id = 1;
  string runner_hostname = 2;
  StreamInfo stream = 3;
  StreamVersion stream_version = 4;
  WorkState status = 5;
  string last_error = 6;
}

// ActionUpdateNotification is sent when an action's status changes
message ActionUpdateNotification {
  string job_id = 1;
  string action_type = 2;
  WorkState status = 3;
  string last_error = 4;
}

message NotificationResponse {

}
